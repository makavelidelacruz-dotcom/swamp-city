<!--
  CHAOS TRIALS: SWAMP CITY
  A Grand Theft Auto style MML world for 4 teams and 50+ players.
  Built on the same patterns as Grand Theft Dino: team check-in prompts, a hidden host bank
  driven by the external host controller, per-player messages with visible-to, and one
  game running at a time.

  Games:   BANK JOB (heist) | GATOR PIT (arena) | LUCKY WHEEL (casino) | TURF WAR (turf)
  Teams:   GATORS (green) | MUNYONS (blue) | BULLFROGS (gold) | COTTONMOUTHS (purple)
  Rides:   8 drivable swamp buggies (amphibious) + 3 airboats on a loop around the city

  Everything is built from MML primitives, so this one file runs on its own.
  Change HOST_KEY below before your event, and use the same code in the controller.
-->
<m-group id="world"></m-group>
<m-group id="hostbank" visible="false">
  <m-group id="hb-heist"></m-group>
  <m-group id="hb-arena"></m-group>
  <m-group id="hb-casino"></m-group>
  <m-group id="hb-turf"></m-group>
  <m-group id="hb-stop"></m-group>
  <m-group id="hb-note"></m-group>
  <m-group id="hb-reset"></m-group>
  <m-group id="hb-cars"></m-group>
  <m-group id="hb-state" data-state="{}" data-roster="[[],[],[],[]]"></m-group>
</m-group>
<script>
(function () {
  "use strict";

  /* =========================================================================
     CONFIG - the only part you should need to edit
     ========================================================================= */
  const CONFIG = {
    HOST_KEY: "2164fdc8f46047cdde8b2b0d4a83e3cc", // paste this into the controller's Host code box
    DETAIL: "high",          // "low" cuts trees and plants roughly in half
    LIGHT_LEVEL: 1,          // brightness of every light, 0 to 1
    // "front": you stand just outside the east dock with the city ahead (default). "edge": on the Visitor Center
    // plaza. "center": the old placement on the bank.
    SPAWN: "front",
    TURN: 0,                 // turn the whole build 90 / 180 / 270 degrees if it ends up beside or behind you
    CASTLE_BASE: "",         // optional castle GLB folder
    FRAMES: [],              // optional m-frame embeds: [{ src: "wss://...", x, y, z, ry }]
    MODELS: { buggy: "", airboat: "", gator: "" },
    KENNEY: true,           // false = primitives only
    // Models load from ASSET_HOST (a folder URL) or ASSET_URLS (one link or mmlstorage id per model).
    ASSET_HOST: "https://raw.githubusercontent.com/makavelidelacruz-dotcom/swamp-city/main/swamp-city-assets/",
    ASSET_URLS: {},
    NATURE: true, MEDIEVAL: true, DOWNTOWN: true, STREETS: true, BAKED: true,   // CC0 model sets (need the hosted models)
    BOATS: true
  };

  /* =========================================================================
     PALETTE AND TEAMS
     ========================================================================= */
  const INK = "#0b1a24", PAPER = "#f4ead8", AMBER = "#ffc857", SKY = "#9fd8e6", NEON = "#2ff3e0", PINK = "#ff4fa3";
  const KIND = { info: "#0b1a24", good: "#0f3b2c", bad: "#4a1424" };
  const TEAMS = [
    { name: "GATORS", color: "#4fe08f", tone: "GREEN" },
    { name: "MUNYONS", color: "#3fd0ff", tone: "BLUE" },
    { name: "BULLFROGS", color: "#ffc23d", tone: "GOLD" },
    { name: "COTTONMOUTHS", color: "#c48bff", tone: "PURPLE" }
  ];
  const WOOD = "#6b4a2b", WOOD_D = "#3f2b1a", ASPHALT = "#2a2c2f", STONE = "#5c5547", MOSS = "#8f9c7a";

  /* =========================================================================
     CITY GRID (meters). North is -z. Grid centre CZ sits on the bank vault, so
     all four hideouts are the same distance from the loot.
     ========================================================================= */
  const CZ = -20;
  const HALF = 215; // island half-width (the first version was 108)
  const ISLAND = { x1: -HALF, x2: HALF, z1: CZ - HALF, z2: CZ + HALF };
  const ROAD_X = [-200, -150, -100, -50, 50, 100, 150, 200];
  const ROAD_Z = ROAD_X.map(v => CZ + v);
  const HIDEOUTS = [ // team index -> centre and facing (front faces the road toward downtown)
    { x: 125, z: CZ - 125, ry: 0 },    // GATORS - north-east
    { x: -125, z: CZ + 125, ry: 180 }, // MUNYONS - south-west
    { x: 125, z: CZ + 125, ry: 180 },  // BULLFROGS - south-east
    { x: -125, z: CZ - 125, ry: 0 }    // COTTONMOUTHS - north-west
  ];

  /* Kenney CC0 asset table: name -> [repo, file] */
  const RAW = {
    racing: "https://raw.githubusercontent.com/KenneyNL/starter-kit-racing/2f2e5f2646dda89cb21d4e8539bab60c6e955dc8/models/",
    city: "https://raw.githubusercontent.com/KenneyNL/starter-kit-city-builder/4535092b740b378b700efd9df9e27a631815b84a/models/",
    plat: "https://raw.githubusercontent.com/KenneyNL/starter-kit-3d-platformer/3fa8a04b1c01ab23db43123d4ce814a34c3fc7f0/models/"
  };
  const ASSET = {
    "truck-red": ["racing", "vehicle-truck-red.glb"], "truck-yellow": ["racing", "vehicle-truck-yellow.glb"],
    "truck-green": ["racing", "vehicle-truck-green.glb"], "truck-purple": ["racing", "vehicle-truck-purple.glb"],
    "motorcycle": ["racing", "vehicle-motorcycle.glb"], "tents": ["racing", "decoration-tents.glb"],
    "building-a": ["city", "building-small-a.glb"], "building-b": ["city", "building-small-b.glb"],
    "building-c": ["city", "building-small-c.glb"], "building-d": ["city", "building-small-d.glb"],
    "garage": ["city", "building-garage.glb"], "fountain": ["city", "pavement-fountain.glb"],
    "cloud": ["plat", "cloud.glb"], "coin": ["plat", "coin.glb"]
  };
  const KB_H = { "building-a": 0.95, "building-b": 1.63, "building-c": 1.75, "building-d": 1.0 }; // model heights per unit
  function asset(name) {
    if (CONFIG.ASSET_URLS[name]) return CONFIG.ASSET_URLS[name];
    if (CONFIG.ASSET_HOST) return CONFIG.ASSET_HOST.replace(/\/?$/, "/") + name + ".glb";
    const a = ASSET[name];
    return RAW[a[0]] + a[1];
  }
  const KEN = !!CONFIG.KENNEY;
  const NATURE_NAMES = ["deadtree-1", "deadtree-2", "deadtree-3", "deadtree-4", "deadtree-5", "deadtree-6", "deadtree-7", "deadtree-8", "deadtree-9", "deadtree-10",
    "normaltree-1", "normaltree-2", "normaltree-3", "bush", "bush-large", "bush-large-flowers", "bush-small-flowers", "plant-flowers", "grass-large",
    "rock-1", "rock-2", "rock-3", "rock-4", "rock-5"];
  const NAT = !!CONFIG.NATURE && (!!CONFIG.ASSET_HOST || NATURE_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  // ASSET_URLS values are full links, or just an mmlstorage file id (64 hex), which keeps the document small
  function natURL(name) { const u = CONFIG.ASSET_URLS[name]; if (u) return u.includes("://") ? u : "https://mmlstorage.com/" + u; return CONFIG.ASSET_HOST.replace(/\/?$/, "/") + name + ".glb"; }
  const MED_DIM = { "med-house": [8.4, 10], "med-townhouse": [5.8, 7.8], "med-hall": [10, 12.6], "med-cottage": [5.8, 5.8] }; // footprints incl. roof overhang
  // enterable versions (open doorway, wooden floor, ceiling): [door x, depth] in model space
  const MED_DOOR = { "med-house": [0, 8], "med-townhouse": [1, 6], "med-hall": [1, 10], "med-cottage": [1, 4] };
  const MED_NAMES = Object.keys(MED_DIM).map(n => n + "-v3").concat(["med-wagon", "med-crate", "med-fence", "med-ironfence"]);
  const MED = !!CONFIG.MEDIEVAL && (!!CONFIG.ASSET_HOST || MED_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const DT_DIM = { "dt-large": [20.6, 16.6], "dt-medium": [15.1, 13.1], "dt-small": [12.5, 14.5] };
  const DT_NAMES = Object.keys(DT_DIM).concat(["dt-acunit", "dt-bollard", "dt-planter", "dt-manhole"]);
  const DT = !!CONFIG.DOWNTOWN && (!!CONFIG.ASSET_HOST || DT_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const ST_NAMES = ["road-seg-34", "road-seg-84", "road-seg-4", "road-cross", "ground-grass", "plaza-pavers"];
  const ST = !!CONFIG.STREETS && (!!CONFIG.ASSET_HOST || ST_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const BOAT_NAMES = ["yacht-1", "yacht-2", "sailboat", "airboat-1", "airboat-2", "airboat-3", "airboat-4", "airboat-prop",
    "shrimpboat-1", "shrimpboat-2", "skiff-1", "skiff-2", "cloud-1", "cloud-2", "cloud-3", "gator", "gator-bronze",
    "pickup-red", "pickup-blue", "pickup-gold", "pickup-green",
    "wheel-spin", "wheel-frame", "slot-purple", "slot-teal", "slot-red", "slot-mega", "slot-reel", "slot-lever", "dice",
    "bet-crown", "bet-gator", "bet-frog", "bet-skull",
    "ferris-frame", "ferris-rim", "gondola-pink", "gondola-teal", "gondola-gold", "gondola-purple", "carousel", "carousel-base", "carousel-gator", "carousel-frog",
    "drop-tower", "drop-ring", "whack-booth", "whack-gator", "striker", "striker-puck", "fair-arch", "fair-pole", "fair-garland",
    "stand-funnel", "stand-boudin", "stand-snowball", "stand-gatorstick", "bank", "bank-vault", "money-bag",
    "team-gator", "team-heron", "team-frog", "team-snake", "beam-gator", "beam-heron", "beam-frog", "beam-snake", "gator-junk", "pit-arena", "pit-gator", "pit-jaw"];
  const ICON_NAMES = ["team-gator", "team-heron", "team-frog", "team-snake"];   // crew mascots, same order as TEAMS
  const BOATS = !!CONFIG.BOATS && (!!CONFIG.ASSET_HOST || BOAT_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  // separate random stream for boats and extra clouds, so the baked city layout never shifts
  let seed2 = 9871;
  const rnd2 = () => { seed2 = (seed2 * 16807) % 2147483647; return (seed2 - 1) / 2147483646; };
  const BAKE_NAMES = ["city-a", "city-b", "city-c", "city-d", "city-e"];
  const BAKE_EXPORT = !!CONFIG.BAKE_EXPORT; // used only when generating the baked models
  function natModel(name, x, y, z, s, ry, collide) {
    return el("m-model", { src: natURL(name), x: r2(x), y: r2(y), z: r2(z), ry: Math.round(ry), sx: r2(s), sy: r2(s), sz: r2(s), collide: collide ? "true" : "false", "cast-shadows": "false" });
  }

  const W = document.getElementById("world");
  // VISITOR CENTER on the east edge (the old KGTR radio block). The world is shifted so its spawn spot is the document
  // origin: wherever the build is placed, people arrive at the Visitor Center, not in the middle of the city.
  // The Visitor Center faces east, toward the dock where people arrive; the dock's land end (arriveX) is just past
  // the edge of the build, so whoever places it stands off the build with the whole city straight ahead of them.
  const VC = { x: 164, z: CZ, front: 170, standX: 179, spawnX: 187, arriveX: 242 };
  {
    const SP = String(CONFIG.SPAWN || "front");
    if (!BAKE_EXPORT && SP !== "center") {
      const [ax, az, ry0] = SP === "edge" ? [VC.spawnX, VC.z, 0] : [VC.arriveX, VC.z, -90];   // -90: the city lies ahead (-z)
      const ry = ry0 + (+CONFIG.TURN || 0), a = ry * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
      const rnd = n => String(Math.round(n * 100) / 100 + 0);
      W.setAttribute("x", rnd(-(c * ax + sn * az))); W.setAttribute("z", rnd(-(-sn * ax + c * az)));
      if (ry % 360) W.setAttribute("ry", String(ry));
    }
  }
  const FOOT = []; // car blockers: {x1,x2,z1,z2} or {cx,cz,r}
  let seed = 7;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const LOW = CONFIG.DETAIL === "low";
  // the baked city matches the full-detail layout with every add-on on, so it only switches on in that setup
  const BAKED = !BAKE_EXPORT && !!CONFIG.BAKED && !LOW && KEN && NAT && MED && DT && ST && (!!CONFIG.ASSET_HOST || BAKE_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const now = () => Date.now();
  const r2 = n => Math.round(n * 100) / 100;

  /* =========================================================================
     ELEMENT HELPERS
     ========================================================================= */
  function el(tag, attrs, parent) {
    if (tag === "m-light") { // every light is capped at LIGHT_LEVEL (never above 1)
      const lvl = Math.max(0, Math.min(1, Number(CONFIG.LIGHT_LEVEL) || 0));
      attrs = Object.assign({}, attrs, { intensity: lvl, enabled: lvl > 0 ? "true" : "false" });
    }
    const e = document.createElement(tag);
    const hints = attrs && (attrs.mat || attrs.mount) ? { mat: attrs.mat, mount: attrs.mount, drop: attrs.drop, back: attrs.back } : null;
    for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null && !HINT_KEYS[k]) e.setAttribute(k, String(attrs[k]));
    if (STATIC && BAKEABLE[tag]) {
      if (BAKE_EXPORT) { e.setAttribute("data-bake", "1"); if (hints) for (const k in hints) if (hints[k] != null) e.setAttribute("data-" + k, String(hints[k])); }
      else if (BAKED) return e; // drawn by the textured city models instead
    }
    (parent || (OFFSTAGE ? VOID : W)).appendChild(e);
    return e;
  }
  // Built "offstage": made but never added to the world. Used for the old swamp scenery, so every later
  // random placement (and the baked city) stays exactly where it was.
  let OFFSTAGE = false;
  const VOID = document.createElement("m-group");
  const offstage = fn => { const p = OFFSTAGE; OFFSTAGE = true; try { return fn(); } finally { OFFSTAGE = p; } };
  let STATIC = false;
  const BAKEABLE = { "m-cube": 1, "m-cylinder": 1, "m-sphere": 1, "m-label": 1, "m-plane": 1 };
  const HINT_KEYS = { mat: 1, mount: 1, drop: 1, back: 1 };
  const stat = fn => { const p = STATIC; STATIC = true; try { return fn(); } finally { STATIC = p; } };
  const live = fn => { const p = STATIC; STATIC = false; try { return fn(); } finally { STATIC = p; } };
  const grp = (a, p) => el("m-group", a, p);
  // Time-synced keyframe animation: every client plays it from the same document time, late joiners included.
  // One animation per attribute per element; a new one replaces the old. Holds the end value when finished.
  const docNow = () => { try { const v = document.timeline && document.timeline.currentTime; return typeof v === "number" && isFinite(v) ? Math.round(v) : null; } catch (e) { return null; } };
  const ANIM = docNow() !== null;
  function playAnim(node, attr, start, end, duration, easing, opts) {
    for (const c of Array.from(node.children)) if (c.tagName.toLowerCase() === "m-attr-anim" && c.getAttribute("attr") === attr) c.remove();
    const a = { attr, start: r2(start), end: r2(end), "start-time": docNow() + ((opts && opts.delay) || 0), duration: Math.round(duration), easing: easing || "linear" };
    if (opts && opts.pingPong) a["ping-pong"] = "true";
    el("m-attr-anim", a, node);
    node.setAttribute(attr, String(r2(opts && opts.pingPong ? start : end)));
  }
  const box = (a, p) => el("m-cube", Object.assign({ "cast-shadows": "false" }, a), p);
  const cyl = (a, p) => el("m-cylinder", Object.assign({ "cast-shadows": "false" }, a), p);
  const sph = (a, p) => el("m-sphere", Object.assign({ "cast-shadows": "false", collide: "false" }, a), p);
  const text = (content, a, p) => el("m-label", Object.assign({ content, alignment: "center", color: INK, "font-color": PAPER, emissive: 0.35, collide: "false" }, a), p);
  const glow = (a, p) => el("m-label", Object.assign({ content: "", emissive: 0.9, collide: "false" }, a), p);
  const setT = (node, s) => { if (node && node.getAttribute("content") !== s) node.setAttribute("content", s); };
  const onClick = (nodes, fn) => (Array.isArray(nodes) ? nodes : [nodes]).forEach(n => n.addEventListener("click", e => {
    const cid = e.detail && e.detail.connectionId;
    if (cid != null) fn(cid, e);
  }));
  function footBox(cx, cz, w, d, ry) {
    const side = Math.abs(Math.round(ry || 0)) % 180 === 90;
    const hw = (side ? d : w) / 2, hd = (side ? w : d) / 2;
    FOOT.push({ x1: cx - hw, x2: cx + hw, z1: cz - hd, z2: cz + hd });
  }

  /* =========================================================================
     BUILDINGS
     ========================================================================= */
  const WINDOWS = ["#ffd98a", "#ffe9b8", "#8fd3ff", "#ffb36b", "#1d2a33"];
  // Every block-built house sits on the ground and is hollow: walls with a doorway, a wooden floor, a ceiling and a lamp.
  // The working door and the CLAIM button are added later (buildHouses) because they change during play.
  const HOUSES = [];
  function building(o) {
    const g = grp({ x: o.x, y: 0, z: o.z, ry: o.ry || 0 });
    const w = o.w, d = o.d, h = o.h, base = 0.1, T = 0.3, DW = 1.6, DH = 2.6;
    const mat = o.wall || (o.stilts ? "siding" : "plaster"), yc = base + h / 2, side = (w - DW) / 2;
    box({ y: yc, z: -d / 2 + T / 2, width: w, height: h, depth: T, color: o.color, mat }, g);                                   // back wall
    for (const s of [-1, 1]) box({ x: s * (w / 2 - T / 2), y: yc, width: T, height: h, depth: r2(d - 2 * T), color: o.color, mat }, g);   // side walls
    for (const s of [-1, 1]) box({ x: r2(s * (DW / 2 + side / 2)), y: yc, z: d / 2 - T / 2, width: r2(side), height: h, depth: T, color: o.color, mat }, g); // front, beside the door
    box({ y: r2(base + DH + (h - DH) / 2), z: d / 2 - T / 2, width: DW, height: r2(h - DH), depth: T, color: o.color, mat }, g);       // over the door
    const ceil = r2(base + Math.min(h - 0.15, 3.5));
    box({ y: base + 0.06, width: r2(w - 2 * T), height: 0.12, depth: r2(d - 2 * T), color: "#8a6a4a", mat: "planks" }, g);              // floor
    box({ y: ceil, width: r2(w - 2 * T), height: 0.16, depth: r2(d - 2 * T), color: "#e8e2d4", mat: "plaster" }, g);                    // ceiling
    glow({ y: r2(ceil - 0.09), rx: 90, width: 0.7, height: 0.7, color: "#fff2c8", emissive: 1, mat: "globe" }, g);                       // ceiling lamp
    for (const s of [-1, 1]) box({ x: s * (DW / 2 + 0.06), y: base + DH / 2, z: d / 2 + 0.02, width: 0.12, height: DH, depth: 0.42, color: "#3a2a1c", collide: "false", mat: "planks" }, g);
    box({ y: base + DH + 0.06, z: d / 2 + 0.02, width: DW + 0.24, height: 0.12, depth: 0.42, color: "#3a2a1c", collide: "false", mat: "planks" }, g);     // door frame
    box({ y: base + h + 0.15, width: w + 0.5, height: 0.3, depth: d + 0.5, color: o.trim || "#2b2b2b", collide: "false", mat: "cornice" }, g);
    if (o.roof === "gable") {
      const a = 24, half = w / 2 + 0.4, len = half / Math.cos(a * Math.PI / 180);
      for (const s of [-1, 1])
        box({ x: s * half / 2, y: base + h + 0.3 + half / 2 * Math.tan(a * Math.PI / 180), width: len, height: 0.25, depth: d + 0.8, rz: -s * a, color: o.roofColor || "#5a3b2a", collide: "false", mat: o.stilts ? "shingle" : "tile" }, g);
    }
    const floors = Math.min(o.maxFloors || 99, Math.max(1, Math.floor((h - 0.6) / 3.2)));
    for (let f = 0; f < floors; f++) {
      const wc = WINDOWS[Math.floor(rand() * WINDOWS.length)], wy = base + 1.9 + f * 3.2;
      if (f === 0) {   // ground floor: a window on each side of the door
        const sw = w * 0.37 - 1.25;
        if (sw > 0.8) for (const s of [-1, 1]) glow({ x: r2(s * (1.25 + sw / 2)), y: wy, z: d / 2 + 0.03, width: r2(sw), height: 1.1, color: wc, emissive: 0.55, mat: "window" }, g);
      } else glow({ y: wy, z: d / 2 + 0.03, width: w * 0.74, height: 1.1, color: wc, emissive: 0.55, mat: "window" }, g);
      if (o.side !== false) glow({ x: w / 2 + 0.03, y: wy, ry: 90, width: d * 0.7, height: 1.1, color: wc, emissive: 0.55, mat: "window" }, g);
    }
    if (o.balcony && floors >= 2) {
      box({ y: base + 3.25, z: d / 2 + 0.7, width: w * 0.8, height: 0.18, depth: 1.4, color: "#2b2b2b", mat: "iron" }, g);
      box({ y: base + 3.8, z: d / 2 + 1.38, width: w * 0.8, height: 0.9, depth: 0.06, color: "#151515", collide: "false", mat: "railing" }, g);
    }
    if (o.sign) {
      text(o.sign, { y: base + h + 1.4, z: d / 2 - 0.2, width: r2(Math.min(w * 0.96, Math.max(w * 0.75, o.sign.length * 0.72 + 2.2))), height: 1.9, "font-size": 85, color: "#120d10", "font-color": o.signColor || PINK, emissive: 0.9, mount: "roof", drop: r2(1.4 - 0.95 - 0.3) }, g);
    }
    HOUSES.push({ g, doorX: 0, doorZ: r2(d / 2 - T / 2), frontZ: r2(d / 2 + 0.05), backZ: r2(-d / 2 + T), base, dw: DW, dh: DH, signY: r2(base + DH + 0.42) });
    footBox(o.x, o.z, w, d, o.ry);
    return g;
  }

  function tower(o) {
    const g = grp({ x: o.x, y: 0, z: o.z, ry: o.ry || 0 });
    const w = o.w, d = o.d, h = o.h;
    box({ y: h / 2 + 0.1, width: w, height: h, depth: d, color: o.color, mat: "concrete" }, g);
    const glass = o.glass || "#7fb8c9";
    glow({ y: h / 2 + 1, z: d / 2 + 0.04, width: w * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    glow({ y: h / 2 + 1, x: w / 2 + 0.04, ry: 90, width: d * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    glow({ y: h / 2 + 1, x: -w / 2 - 0.04, ry: -90, width: d * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    for (let y = 4; y < h - 1; y += 4) box({ y, width: w + 0.3, height: 0.35, depth: d + 0.3, color: o.band || "#3a4148", collide: "false", mat: "metal" }, g);
    box({ y: h + 0.4, width: w + 0.6, height: 0.6, depth: d + 0.6, color: "#22262a", collide: "false", mat: "cornice" }, g);
    cyl({ x: w * 0.25, y: h + 2.2, z: -d * 0.2, radius: 1.3, height: 3, color: "#7a5b3a", collide: "false", mat: "tank" }, g); // water tank
    cyl({ x: -w * 0.25, y: h + 4, radius: 0.08, height: 7, color: "#aaaaaa", collide: "false", mat: "steel" }, g);   // antenna
    sph({ x: -w * 0.25, y: h + 7.6, radius: 0.35, color: "#ff3b3b", mat: "beacon" }, g);
    if (o.sign) text(o.sign, { y: h - 1.9, z: d / 2 + 0.1, width: r2(w * 0.94), height: 2.5, "font-size": 110, color: "#120d10", "font-color": o.signColor || NEON, emissive: 0.9, mount: "wall", back: 0.1 }, g);
    if (DT) for (let k = 0; k < 3; k++) el("m-model", { src: natURL("dt-acunit"), x: r2(-w * 0.3 + k * w * 0.22), y: h + 0.7, z: r2(d * 0.25), sx: 1.8, sy: 1.8, sz: 1.8, collide: "false", "cast-shadows": "false" }, g);
    box({ y: 1.6, z: d / 2 + 0.08, width: 3.5, height: 3.2, depth: 0.12, color: "#10161a", collide: "false", mat: "glassdoor" }, g);
    footBox(o.x, o.z, w, d, o.ry);
    return g;
  }

  function tree(x, z, s, inWater) {
    if (NAT) {
      if (!inWater) return natModel("normaltree-" + (1 + Math.floor(rand() * 3)), x, 0.1, z, s * 1.35, rand() * 360, true);
      if (rand() < 0.65) return natModel("deadtree-" + (1 + Math.floor(rand() * 10)), x, -1.1, z, s * (1.5 + rand() * 0.6), rand() * 360, true);
    }
    const y0 = inWater ? -1.1 : 0.1;
    cyl({ x, y: y0 + 0.6 * s, z, radius: 0.95 * s, height: 1.2 * s, color: "#4a3a2a", collide: "false" });
    cyl({ x, y: y0 + 4 * s, z, radius: 0.36 * s, height: 7.6 * s, color: "#5a4632" });
    sph({ x, y: y0 + 7.2 * s, z, radius: 2.8 * s, sy: 0.42, color: "#3c5a2e" });
    sph({ x: x + 0.6 * s, y: y0 + 8.5 * s, z: z - 0.4 * s, radius: 2 * s, sy: 0.45, color: "#46663a" });
    if (!LOW) for (let m = 0; m < 2; m++) {
      const a = rand() * Math.PI * 2, rr = 1.6 * s;
      box({ x: x + Math.cos(a) * rr, y: y0 + 5.6 * s, z: z + Math.sin(a) * rr, width: 0.25, height: 2.2 * s, depth: 0.08, color: MOSS, opacity: 0.85, collide: "false" });
    }
  }

  function lamp(x, z) {
    cyl({ x, y: 2.6, z, radius: 0.09, height: 5, color: "#1b1b1b", collide: "false", mat: "iron" });
    sph({ x, y: 5.15, z, radius: 0.32, color: "#ffe9a8", mat: "globe" });
  }

  /* =========================================================================
     GROUND, WATER, ROADS
     ========================================================================= */
  const SWAMP_R = 360;   // round swamp around the city, 720 m across (was a 980 m square): about 70% less open water
  function buildGround() {
    // no open water any more: the city ends at a stone seawall; boats sit in small slips against it (buildBoats)
    box({ y: -2.6, z: CZ, width: ISLAND.x2 - ISLAND.x1, height: 2.84, depth: ISLAND.z2 - ISLAND.z1, color: "#6a6a64", mat: "stone" });   // seawall
    box({ y: ST ? -0.58 : -0.5, z: CZ, width: ISLAND.x2 - ISLAND.x1, height: 1.2, depth: ISLAND.z2 - ISLAND.z1, color: "#3d4a2c", mat: "bank" }); // island
    if (ST) natModel("ground-grass", 0, 0.11, CZ, 1, 0, true);                                                                // grass lawn
    // boardwalk rim around the island
    const rim = (x, z, w, d) => box({ x, y: 0.16, z, width: w, height: 0.12, depth: d, color: WOOD, mat: "boardwalk" });
    rim(0, ISLAND.z1 + 1.5, 2 * HALF, 3); rim(0, ISLAND.z2 - 1.5, 2 * HALF, 3);
    rim(ISLAND.x1 + 1.5, CZ, 3, 2 * HALF); rim(ISLAND.x2 - 1.5, CZ, 3, 2 * HALF);
  }

  function buildRoads() {
    const L = 2 * HALF - 4;
    if (ST) {
      const segs = [[-(HALF - 5), 4]];
      for (let k = 0; k < ROAD_X.length - 1; k++) segs.push([(ROAD_X[k] + ROAD_X[k + 1]) / 2, ROAD_X[k + 1] - ROAD_X[k] - 16]);
      segs.push([HALF - 5, 4]);
      for (const r of ROAD_X) for (const [c, len] of segs) {
        natModel("road-seg-" + len, r, 0.14, CZ + c, 1, 0, true);   // north-south street
        natModel("road-seg-" + len, c, 0.14, CZ + r, 1, 90, true);  // east-west street
      }
      for (const x of ROAD_X) for (const z of ROAD_X) natModel("road-cross", x, 0.14, CZ + z, 1, 0, true);
    } else {
    for (const z of ROAD_Z) {
      box({ y: 0.11, z, width: L, height: 0.06, depth: 10, color: ASPHALT });
      box({ y: 0.145, z: z - 0.18, width: L - 4, height: 0.01, depth: 0.15, color: AMBER, collide: "false" });
      box({ y: 0.145, z: z + 0.18, width: L - 4, height: 0.01, depth: 0.15, color: AMBER, collide: "false" });
    }
    for (const x of ROAD_X) {
      box({ x, y: 0.11, z: CZ, width: 10, height: 0.06, depth: L, color: ASPHALT });
      box({ x: x - 0.18, y: 0.145, z: CZ, width: 0.15, height: 0.01, depth: L - 4, color: AMBER, collide: "false" });
      box({ x: x + 0.18, y: 0.145, z: CZ, width: 0.15, height: 0.01, depth: L - 4, color: AMBER, collide: "false" });
    }
    }
    if (DT) for (let i = 0; i < (LOW ? 20 : 40); i++) {
      const along = (rand() - 0.5) * (L - 20), lane = (rand() < 0.5 ? -1 : 1) * 2.5, horiz = rand() < 0.5, r = (horiz ? ROAD_Z : ROAD_X)[Math.floor(rand() * 8)];
      natModel("dt-manhole", horiz ? along : r + lane, 0.145, horiz ? r + lane : CZ + along, 1.4, rand() * 360, false);
    }
    const step = LOW ? 90 : 60, nearRoad = v => ROAD_X.some(r => Math.abs(v - r) < 8);
    for (const z of ROAD_Z) for (let x = -HALF + 20; x <= HALF - 20; x += step) if (!nearRoad(x)) lamp(x, z + 6);
    for (const x of ROAD_X) for (let z = -HALF + 20; z <= HALF - 20; z += step) if (!nearRoad(z)) lamp(x + 6, CZ + z);
  }

        text("CLICK THE VAULT TO GRAB A BAG", { y: 5.6, z: CZ + 3.4, width: 6.2, height: 0.5, "font-size": 30, "font-color": AMBER }, loot);
        text("CLICK THE VAULT TO GRAB A BAG", { y: 5.6, z: CZ - 3.4, ry: 180, width: 6.2, height: 0.5, "font-size": 30, "font-color": AMBER }, loot);

      cyl({ y: 2.2, z: CZ - 3.02, rx: 90, radius: 1.7, height: 0.25, color: "#c9a24a", collide: "false", mat: "vaultdoor" });
      live(() => {
      const loot = grp({ "data-game": "heist", visible: "false" });
      for (let i = 0; i < 10; i++) {

      }
      if (KEN) for (let i = 0; i < 8; i++) {

        const c = el("m-model", { src: asset("coin"), x: r2(Math.cos(a) * 5.2), y: 1.6, z: r2(CZ + Math.sin(a) * 5.2), sx: 3, sy: 3, sz: 3, collide: "false", "cast-shadows": "false" }, loot);

      }

      text("CLICK THE VAULT TO GRAB A BAG", { y: 5.1, z: CZ - 3.3, ry: 180, width: 6.2, height: 0.5, "font-size": 30, "font-color": AMBER }, loot);

    else for (const zz of [z1 + 1.2, z2 - 1.2]) for (let x = x1 + 5; x < x2 - 4; x += 3.2) {

    }
    if (!BOATS) for (const [x, z] of [[68, CZ - 10], [68, CZ + 10], [76, CZ - 12], [76, CZ + 12]]) {
      cyl({ x, y: 0.5, z, radius: 1.7, height: 0.9, color: "#3a2a1a", mat: "woodpolish" });

  // ---- the pit's gators -----------------------------------------------------------
  // Two SWEEPERS ride a turntable across the throne (one close to the middle, one near the edge) and three
  // LUNGERS charge out of the mud at the throne's edge and back. All of them are solid, so they shove people
  // where the player's client pushes avatars out of moving objects, and the game also checks where they are:
  // anyone a gator runs into is CHOMPED and doesn't count on the throne for a few seconds. Their motion is
  // time-synced keyframes, so the server works out exactly where each gator is from the same clock.
  const THRONE_IDLE = "#7a6a48";
  const PIT = { mode: "idle", T0: 0, sweepMs: 12000, lungeMs: 1600, R0: 9.3, R1: 5.4, sweepers: [], lungers: [], stun: new Map(), chomp: null };
  const PIT_SPEED = { live: [12000, 1600], frenzy: [7000, 1000] };
  const setA = (node, k, v) => { if (node && node.getAttribute(k) !== String(v)) node.setAttribute(k, String(v)); };
  function loopAnim(node, attr, start, end, duration, startTime, opts) {
    for (const c of Array.from(node.children)) if (c.tagName.toLowerCase() === "m-attr-anim" && c.getAttribute("attr") === attr) c.remove();
    const a = { attr, start: r2(start), end: r2(end), "start-time": startTime, duration: Math.round(duration), loop: "true", easing: (opts && opts.easing) || "linear" };
    if (opts && opts.pingPong) a["ping-pong"] = "true";
    el("m-attr-anim", a, node);
  }
  function stopAnim(node, attr, value) {
    for (const c of Array.from(node.children)) if (c.tagName.toLowerCase() === "m-attr-anim" && c.getAttribute("attr") === attr) c.remove();
    node.setAttribute(attr, String(r2(value)));
  }
  function pitGator(parent, a) {
    const g = grp(a, parent);
    el("m-model", { src: natURL("pit-gator"), collide: "true", "cast-shadows": "false" }, g);
    const j = grp({ y: 0.24, z: 1.4 }, g);
    el("m-model", { src: natURL("pit-jaw"), collide: "false", "cast-shadows": "false" }, j);
    return { g, j };
  }
  function buildPitGators() {
    const { x, z } = ARENA;
    PIT.rig = grp({ x, y: 0.5, z });
    PIT.sweepers = [[1.7, 180], [-3.3, 0]].map(([lx, ry]) => Object.assign(pitGator(PIT.rig, { x: lx, ry }), { lx, fwd: ry === 180 ? -1 : 1 }));
    PIT.lungers = [90, 210, 330].map((deg, i) => {
      const a = deg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
      const ry = Math.atan2(-c, -sn) * 180 / Math.PI;   // facing the middle
      return Object.assign(pitGator(null, { x: r2(x + c * PIT.R0), y: 0.19, z: r2(z + sn * PIT.R0), ry: r2(ry) }), { c, sn, i });
    });
    pitMode("idle");
  }
  // idle: dozing (jaws breathing slowly); live / frenzy: turntable sweeping, lungers charging, jaws snapping
  function pitMode(mode) {
    if (!PIT.rig) return;
    const t0 = docNow() || 0; PIT.mode = mode; PIT.T0 = t0;
    const { x, z } = ARENA;
    const all = PIT.sweepers.concat(PIT.lungers);
    if (mode === "idle") {
      stopAnim(PIT.rig, "ry", 0);
      for (const L of PIT.lungers) { stopAnim(L.g, "x", x + L.c * PIT.R0); stopAnim(L.g, "z", z + L.sn * PIT.R0); }
      all.forEach((G, k) => loopAnim(G.j, "rx", 0, 7, 2600 + k * 300, t0, { pingPong: true, easing: "easeInOutSine" }));
      return;
    }
    [PIT.sweepMs, PIT.lungeMs] = PIT_SPEED[mode];
    loopAnim(PIT.rig, "ry", 0, 360, PIT.sweepMs, t0);
    for (const L of PIT.lungers) {
      const st = t0 - Math.round(L.i * PIT.lungeMs * 2 / 3);   // staggered so they take turns
      loopAnim(L.g, "x", x + L.c * PIT.R0, x + L.c * PIT.R1, PIT.lungeMs, st, { pingPong: true });
      loopAnim(L.g, "z", z + L.sn * PIT.R0, z + L.sn * PIT.R1, PIT.lungeMs, st, { pingPong: true });
    }
    all.forEach((G, k) => loopAnim(G.j, "rx", 0, 30, mode === "frenzy" ? 220 : 340, t0 + k * 90, { pingPong: true }));
  }
  // where every gator's body is right now, as a segment from tail-ish to snout, in world-group space
  function pitSegments(t) {
    const { x, z } = ARENA, segs = [];
    if (PIT.mode === "idle" || !PIT.rig) return segs;
    const D = PIT.sweepMs, th = ((((t - PIT.T0) % D) + D) % D) / D * 2 * Math.PI, c = Math.cos(th), sn = Math.sin(th);
    const rot = (lx, lz) => [x + lx * c + lz * sn, z - lx * sn + lz * c];
    for (const S of PIT.sweepers) segs.push([rot(S.lx, -S.fwd * 2.2), rot(S.lx, S.fwd * 3.0)]);
    const L2 = 2 * PIT.lungeMs;
    for (const L of PIT.lungers) {
      const st = PIT.T0 - Math.round(L.i * PIT.lungeMs * 2 / 3), u = ((((t - st) % L2) + L2) % L2) / PIT.lungeMs;
      const r = u <= 1 ? PIT.R0 + (PIT.R1 - PIT.R0) * u : PIT.R1 + (PIT.R0 - PIT.R1) * (u - 1);
      segs.push([[x + L.c * (r + 2.2), z + L.sn * (r + 2.2)], [x + L.c * (r - 3.0), z + L.sn * (r - 3.0)]]);
    }
    return segs;
  }
  function segDist(px, pz, [[ax, az], [bx, bz]]) {
    const dx = bx - ax, dz = bz - az, L = dx * dx + dz * dz || 1;
    const u = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / L));
    return Math.hypot(px - (ax + dx * u), pz - (az + dz * u));
  }
  function pitCheck() {
    if (ACTIVE !== "arena" || PIT.mode === "idle") return;
    const t = docNow(); if (t == null) return;
    const segs = pitSegments(t), wall = now(), { x, z } = ARENA;
    for (const [cid, p] of PROBE.pos) {
      if (Math.hypot(p.x - x, p.z - z) > 13 || p.y > 2.2 || !TEAM.has(cid)) continue;
      if ((PIT.stun.get(cid) || 0) > wall) continue;
      if (segs.some(sg => segDist(p.x, p.z, sg) < 1.05)) {
        PIT.stun.set(cid, wall + 4000);
        PIT.chomp = { name: nameOf(cid), until: wall + 2500 };
        if (ROUNDUP.carry.has(cid)) { roundupDrop(cid, true); say(cid, "arena", "CHOMPED! Your gator got away - go catch another one", "bad"); }
        else say(cid, "arena", "CHOMPED! Wait 4 seconds before you can grab another gator", "bad");
      }
    }
  }
  setInterval(pitCheck, 120);

  /* =========================================================================
     NATURE: cypress, reeds, lily pads, gators
     ========================================================================= */
  function gatorModel(x, y, z, ry, s, color, mat) {
    const g = grp({ x, y, z, ry, sx: s, sy: s, sz: s });
    if (CONFIG.MODELS.gator) { el("m-model", { src: CONFIG.MODELS.gator, collide: "false" }, g); return g; }
    if (BOATS) { el("m-model", { src: natURL(mat === "bronze" ? "gator-bronze" : "gator"), collide: "false" }, g); return g; }
    const c = color || "#4b5e37", m = mat || "gatorskin";
    box({ width: 0.9, height: 0.35, depth: 2.4, color: c, collide: "false", mat: m }, g);
    box({ z: 1.55, y: -0.02, width: 0.6, height: 0.28, depth: 0.9, color: c, collide: "false", mat: m }, g);
    box({ z: 2.15, y: -0.05, width: 0.42, height: 0.18, depth: 0.6, color: c, collide: "false", mat: m }, g);
    sph({ x: 0.2, y: 0.17, z: 1.4, radius: 0.09, color: "#e6d35a", mat: "eye" }, g);
    sph({ x: -0.2, y: 0.17, z: 1.4, radius: 0.09, color: "#e6d35a", mat: "eye" }, g);
    box({ z: -1.8, width: 0.55, height: 0.25, depth: 1.4, color: c, collide: "false", mat: m }, g);
    box({ z: -2.9, width: 0.3, height: 0.18, depth: 1.1, color: c, collide: "false", mat: m }, g);
    return g;
  }

  function buildNature() { offstage(buildSwampScenery); }
  function buildSwampScenery() {   // cypress, lily pads, reeds, rocks and swimming gators that used to fill the swamp
    const nTrees = LOW ? 35 : 65;
    for (let i = 0; i < nTrees; i++) {
      const a = rand() * Math.PI * 2, r = 232 + rand() * 170;
      const x = Math.cos(a) * r, z = CZ + Math.sin(a) * r;
      if (Math.abs(z - CZ) < 8 && Math.abs(x) > HALF - 5 && Math.abs(x) < 335) continue; // keep piers clear
      if (r > 309 && r < 331) continue;                                                // airboat lane
      if (x > ISLAND.x1 - 4 && x < ISLAND.x2 + 4 && z > ISLAND.z1 - 4 && z < ISLAND.z2 + 4) continue;
      tree(x, z, 0.9 + rand() * 0.6, true);
    }
    const nPads = LOW ? 40 : 80;
    for (let i = 0; i < nPads; i++) {
      const a = rand() * Math.PI * 2, r = HALF + 6 + rand() * 180;
      cyl({ x: Math.cos(a) * r, y: -0.39, z: CZ + Math.sin(a) * r, radius: 0.5 + rand() * 0.7, height: 0.04, color: rand() < 0.15 ? "#e88fb8" : "#4f7a35", collide: "false", mat: "lily" });
    }
    const nReeds = LOW ? 50 : 100;
    const shore = (o1, o2) => {
      const side = Math.floor(rand() * 4), u = (rand() - 0.5) * 2 * HALF, o = HALF + o1 + rand() * o2;
      return [side < 2 ? u : (side === 2 ? o : -o), CZ + (side < 2 ? (side === 0 ? o : -o) : u)];
    };
    for (let i = 0; i < nReeds; i++) {
      const [x, z] = shore(1, 6);
      if (Math.abs(z - CZ) < 6 && Math.abs(x) > HALF - 2) continue; // pier
      if (NAT) natModel(rand() < 0.85 ? "grass-large" : "plant-flowers", x, -0.55, z, 2.6 + rand() * 1.6, rand() * 360, false);
      else cyl({ x, y: 0.3, z, radius: 0.05, height: 1.6 + rand(), color: rand() < 0.5 ? "#7a8a3a" : "#8f9a4a", collide: "false" });
    }
    if (NAT) {
      for (let i = 0; i < (LOW ? 15 : 30); i++) { const [x, z] = shore(0, 4); if (Math.abs(z - CZ) < 6) continue; natModel("rock-" + (1 + Math.floor(rand() * 5)), x, -0.9, z, 1.2 + rand() * 1.6, rand() * 360, false); }
      for (let i = 0; i < (LOW ? 20 : 45); i++) { const [x, z] = shore(4, 26); if (Math.abs(z - CZ) < 8) continue; natModel("deadtree-" + (1 + Math.floor(rand() * 10)), x, -1.1, z, 1.4 + rand() * 0.7, rand() * 360, true); }
    }
    // swimming gators (they move, so they stay live)
    live(() => { for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.3, r = 245 + (i % 2) * 30;
      const x = Math.cos(a) * r, z = CZ + Math.sin(a) * r;
      const g = gatorModel(x, -0.42, z, (a * 180 / Math.PI) % 360, 1.2);
      el("m-attr-anim", { attr: "x", start: r2(x - 6), end: r2(x + 6), duration: 22000 + i * 3000, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
    }
    if (BOATS) OFFSTAGE = false, buildMoreGators(), OFFSTAGE = true;
    });
  }

  // extra gators with the modeled alligator: basking in the shallows, lounging at the Gator Farm, cruising further out
  function buildMoreGators() {
    const gm = (x, y, z, ry, s) => el("m-model", { src: natURL("gator"), x: r2(x), y: r2(y), z: r2(z), ry: r2(ry), sx: r2(s), sy: r2(s), sz: r2(s), collide: "false" });

    for (const [x, ry, s] of [[-92, 160, 0.9], [-88.5, 210, 0.8], [-84, 175, 1.0], [-80.5, 120, 0.85]]) gm(x, 0.1 + 0.27 * s, CZ - 23.5 + (x % 2), ry, s);
    offstage(() => { if (!LOW) moreGatorsInWater(gm); });
    // basking on the quay next to the boat slips
    for (const [x, z, ry, s] of [[-206, CZ - 52, 80, 1.0], [206, CZ + 22, -100, 0.9], [-95, CZ + 211, 170, 1.1], [52, CZ - 211, 10, 0.95], [-130, CZ - 211, -20, 0.9], [150, CZ + 211, 200, 1.0]])
      gm(x, 0.15 + 0.27 * s, z, ry, s);
  }
  function moreGatorsInWater(gm) {
    // basking in the shallows, heads toward the shore
    for (let k = 0; k < 12; k++) {
      const side = k % 4, along = -190 + rnd2() * 380, off = HALF + 3 + rnd2() * 5, s = 0.9 + rnd2() * 0.5;
      if (Math.abs(along) < 14) continue;   // keep clear of the piers and boat ramps
      const [x, z, ry] = side === 0 ? [along, CZ - off, 0] : side === 1 ? [along, CZ + off, 180] : side === 2 ? [off, CZ + along, -90] : [-off, CZ + along, 90];
      gm(x, -0.36, z, ry + (rnd2() - 0.5) * 50, s);
    }
    // a second ring of swimmers further out, drifting slowly
    for (let i = 0; i < 6; i++) {
      const a = rnd2() * Math.PI * 2, r = 312 + rnd2() * 30, x = Math.cos(a) * r, z = CZ + Math.sin(a) * r;
      const g = gm(x, -0.42, z, 0, 1.1 + rnd2() * 0.3);
      el("m-attr-anim", { attr: "z", start: r2(z - 8), end: r2(z + 8), duration: 26000 + i * 2500, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
    }
  }

  /* =========================================================================
     AIRBOATS (loop around the city) + PIERS
     ========================================================================= */
  function buildClouds() {
    if (!KEN) return;
    const n = LOW ? 8 : 16;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, r = 30 + rand() * 170, s = 22 + rand() * 24;
      const x = r2(Math.cos(a) * r), z = r2(CZ + Math.sin(a) * r);
      const y = r2(70 + rand() * 40), ry = Math.floor(rand() * 360), dur = 80000 + Math.floor(rand() * 60000);
      const src = BOATS ? natURL("cloud-" + (1 + (i % 3))) : asset("cloud");
      const c = el("m-model", { src, x, y, z, ry, sx: s, sy: r2(BOATS ? s : s * 0.6), sz: s, collide: "false", "cast-shadows": "false" });
      el("m-attr-anim", { attr: "x", start: r2(x - 40), end: r2(x + 40), duration: dur, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, c);
    }
    if (BOATS && !LOW) for (let i = 0; i < 10; i++) {   // a few big, high clouds further out
      const a = rnd2() * Math.PI * 2, r = 90 + rnd2() * 120, s = 45 + rnd2() * 40;
      const x = r2(Math.cos(a) * r), z = r2(CZ + Math.sin(a) * r);
      const c = el("m-model", { src: natURL("cloud-" + (1 + (i % 3))), x, y: r2(110 + rnd2() * 50), z, ry: Math.floor(rnd2() * 360), sx: r2(s), sy: r2(s), sz: r2(s), collide: "false", "cast-shadows": "false" });
      el("m-attr-anim", { attr: "z", start: r2(z - 50), end: r2(z + 50), duration: 120000 + Math.floor(rnd2() * 80000), loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, c);
    }
  }

  function buildAirboats() {
    for (const s of [-1, 1]) {
      // short marina pier (was 102 m), with pilings
      box({ x: s * (HALF + 8), y: 0.25, z: CZ, width: 16, height: 0.3, depth: 4, color: WOOD, mat: "boardwalk" });
      for (let k = 0; k < 3; k++) for (const pz of [-1.8, 1.8]) cyl({ x: s * (HALF + 3 + k * 6), y: -0.5, z: CZ + pz, radius: 0.2, height: 1.8, color: WOOD_D, collide: "false", mat: "log" });
      text("SWAMP CITY MARINA", { x: s * (HALF - 4), y: 2.9, z: CZ - 2.6, ry: s > 0 ? -90 : 90, width: 7, height: 1.2, "font-size": 60, color: "#0e3a52", "font-color": "#ffffff", mount: "post", drop: 2.2 });
    }
    if (BOATS) { buildSlips(); live(buildBoats); return; }
    return;   // no swamp, so no airboat loop in the simple version
    live(() => {
    const loop = grp({ z: CZ });
    el("m-attr-anim", { attr: "ry", start: 0, end: 360, duration: 240000, loop: "true" }, loop);
    const R = 320;
    (BOATS ? [0, 45, 90, 135, 180, 225, 270, 315] : [0, 90, 180, 270]).forEach((phi, i) => {
      const rad = phi * Math.PI / 180;
      const b = grp({ x: r2(Math.cos(rad) * R), y: BOATS ? -0.42 : 0, z: r2(-Math.sin(rad) * R), ry: phi + 180 }, loop);
      if (BOATS) {
        el("m-model", { src: natURL("airboat-" + (1 + (i % 4))) }, b);
        const fan = el("m-model", { src: natURL("airboat-prop"), y: 1.7, z: -2.62, collide: "false", "cast-shadows": "false" }, b);
        el("m-attr-anim", { attr: "rz", start: 0, end: 360, duration: 450, loop: "true" }, fan);
        return;
      }
      if (CONFIG.MODELS.airboat) { el("m-model", { src: CONFIG.MODELS.airboat }, b); return; }
      box({ y: 0.3, width: 4, height: 0.5, depth: 7, color: ["#2e6f8e", "#8e2e5a", "#6f8e2e", "#8e6a2e"][i] }, b);
      box({ y: 0.3, z: 3.8, width: 3, height: 0.45, depth: 1, color: "#d9d2c0", collide: "false" }, b);
      box({ y: 0.95, z: -2.4, width: 1.2, height: 0.8, depth: 0.8, color: "#222", collide: "false" }, b);
      cyl({ y: 2.3, z: -3.1, rx: 90, radius: 1.6, height: 0.25, color: "#1b1b1b", opacity: 0.6, collide: "false" }, b);
      cyl({ y: 2.3, z: -2.95, rx: 90, radius: 0.35, height: 0.3, color: "#aaa", collide: "false" }, b);
      box({ y: 1.0, z: 0.8, width: 3.6, height: 0.5, depth: 0.5, color: WOOD, collide: "false" }, b);
      text("BAYOU LOOP", { y: 0.6, x: 2.02, z: 0.5, ry: 90, width: 3, height: 0.4, "font-size": 30, color: "#111", "font-color": AMBER, emissive: 0.6 }, b);
    });
    });
  }

  // every boat is drivable: airboats and yachts at the piers, shrimp boats and skiffs moored around the island
  let BOAT_N = 0;
  function boat(kind, model, x, z, ry, extra) {
    return vehicle("boat-" + (BOAT_N++), kind, x, z, ry, g => {
      const m = el("m-model", { src: natURL(model), collide: "false" }, g);
      if (extra) extra(g);
      return [m];
    });
  }
  const fan = g => { const f = el("m-model", { src: natURL("airboat-prop"), y: 1.7, z: -2.62, collide: "false", "cast-shadows": "false" }, g); el("m-attr-anim", { attr: "rz", start: 0, end: 360, duration: 450, loop: "true" }, f); };
  // Docked boats: every boat sits in its own little slip against the seawall (no open water, not drivable).
  // [model, x, z, ry]; boats lie along the wall: ry 90 on the north/south walls, 0 on the east/west walls.
  const BOAT_DIM = { yacht: [2.8, 19.1, -0.55], sailboat: [2.3, 14.0, 0], airboat: [1.2, 6.3, -0.35], shrimpboat: [6.7, 14.1, 0.05], skiff: [0.9, 5.1, -0.25] };
  const kindOf = m => m.replace(/-\d+$/, "");
  function dockedBoats() {
    const N = ISLAND.z1, S = ISLAND.z2, E = ISLAND.x2, Wx = ISLAND.x1, gap = 0.6;
    const out = (m) => BOAT_DIM[kindOf(m)][0] + gap;
    const list = [];
    for (const s of [-1, 1]) {   // the two marina piers: a yacht along the north side, a sailboat along the south side
      list.push([s > 0 ? "yacht-1" : "yacht-2", s * (HALF + 10.2), CZ - 2 - out("yacht-1") + 0.2, 90]);
      list.push(["sailboat", s * (HALF + 7.5), CZ + 2 + out("sailboat") - 0.2, 90]);
      [-52, -62, 12, 22].forEach((dz, k) => list.push(["airboat-" + (1 + ((k + (s > 0 ? 0 : 2)) % 4)), s * (HALF + out("airboat-1")), CZ + dz, s > 0 ? 180 : 0]));
      [96, 103, -150, -143].forEach((dz, k) => list.push(["skiff-" + (1 + (k % 2)), s * (HALF + out("skiff-1")), CZ + dz, s > 0 ? 180 : 0]));
    }
    list.push(["yacht-1", -100, S + out("yacht-1"), 90]);
    for (const [x, n] of [[-62, 1], [-40, 2], [40, 1], [62, 2]]) list.push(["shrimpboat-" + n, x, N - out("shrimpboat-1"), 90]);
    for (const [x, n] of [[100, 1], [140, 2], [-160, 1]]) list.push(["shrimpboat-" + n, x, S + out("shrimpboat-1"), 90]);
    for (const x of [-150, -143, 140, 147]) list.push(["skiff-" + (1 + (Math.abs(x) % 2)), x, N - out("skiff-1"), 90]);
    for (const x of [-72, -65, 70, 77]) list.push(["skiff-" + (1 + (Math.abs(x) % 2)), x, S + out("skiff-1"), 90]);
    return list;
  }
  // slips: a pad of water just bigger than the boat, with a mud floor under it (static, baked into the city)
  function buildSlips() {
    for (const s of [-1, 1]) {   // one shared basin round each marina pier
      box({ x: s * (HALF + 10.4), y: -0.45, z: CZ, width: 20.8, height: 0.08, depth: 18, color: "#2d4a3a", opacity: 0.82, collide: "false", mat: "water" });
      box({ x: s * (HALF + 10.4), y: -1.12, z: CZ, width: 20.8, height: 1.28, depth: 18, color: "#6a6a64", mat: "stone" });   // stone basin under the water
    }
    for (const [m, x, z, ry] of dockedBoats()) {
      if (Math.abs(z - CZ) < 12 && Math.abs(x) > HALF) continue;   // inside a pier basin already
      const [hb, L, zc] = BOAT_DIM[kindOf(m)], along = ry === 90;
      const w = along ? L + 3 : 2 * hb + 1.2, d = along ? 2 * hb + 1.2 : L + 3;
      const cx = along ? x + zc * (ry === 90 ? 1 : -1) : x, cz = along ? z : z + zc * (ry === 180 ? -1 : 1);
      box({ x: r2(cx), y: -0.45, z: r2(cz), width: r2(w), height: 0.08, depth: r2(d), color: "#2d4a3a", opacity: 0.82, collide: "false", mat: "water" });
      box({ x: r2(cx), y: -1.12, z: r2(cz), width: r2(w), height: 1.28, depth: r2(d), color: "#6a6a64", mat: "stone" });   // stone basin under the water
    }
  }
  function buildBoats() {
    let k = 0;
    for (const [m, x, z, ry] of dockedBoats()) {
      const g = grp({ id: "boat-" + (k++), x: r2(x), y: WATERLINE, z: r2(z), ry });
      const bob = grp({}, g);   // gentle bob at the mooring
      el("m-attr-anim", { attr: "y", start: 0, end: 0.07, duration: 3000 + (k % 5) * 400, loop: "true", "ping-pong": "true", easing: "easeInOutSine", "start-time": (k * 700) % 3000 }, bob);
      el("m-model", { src: natURL(m), "data-boat": kindOf(m) }, bob);
      if (kindOf(m) === "airboat") el("m-model", { src: natURL("airboat-prop"), y: 1.7, z: -2.62, collide: "false", "cast-shadows": "false" }, bob);
    }
  }

  /* =========================================================================
     OPTIONAL: princess castle on Queen's Isle, extra m-frames
     ========================================================================= */
  function buildOptional() {
    if (CONFIG.CASTLE_BASE) {
      const base = CONFIG.CASTLE_BASE.replace(/\/?$/, "/");
      const ix = 0, iz = CZ - 335;

      text("QUEEN'S ISLE - wade out through the swamp", { x: 0, y: 3, z: ISLAND.z1 - 4, ry: 180, width: 12, height: 0.7, "font-size": 40, "font-color": "#ff9ad5" });

    for (const f of CONFIG.FRAMES) if (f && f.src) el("m-frame", { src: f.src, x: f.x || 0, y: f.y || 0, z: f.z || 0, ry: f.ry || 0 });
  }

  /* =========================================================================
     SWAMP FAIR: Bayou Eye Ferris wheel, Gator-Go-Round carousel, Gator Drop tower,
     Whack-a-Gator, Test Your Bite high striker, food stands and string lights.
     Rides carry players on hidden floors that move with them (same idea as the vehicles).
     ========================================================================= */
  const FAIR = { whack: null, striker: null, drop: null };
  function buildFair() {
    if (MED) { rand(); rand(); rand(); }   // keep the random sequence the old fair used, so the rest of the city stays put
    const G0 = GROUND, PATHC = "#c9a46a";
    // sawdust promenade from the gate to the wheel, and pads under the rides
    box({ x: 0, y: 0.17, z: 147, width: 7.5, height: 0.06, depth: 21, color: PATHC, mat: "sand", collide: "false" });
    box({ x: 0, y: 0.17, z: 132.2 + 4.8, width: 14, height: 0.06, depth: 2.5, color: PATHC, mat: "sand", collide: "false" });
    // entrance arch with its sign
    el("m-model", { src: natURL("fair-arch"), x: 0, y: G0, z: 137 });
    text("SWAMP FAIR", { x: 0, y: G0 + 5.2, z: 136.86, ry: 180, width: 8.6, height: 1.2, "font-size": 92, color: "#2a1238", "font-color": PINK, emissive: 1, mount: "wall", back: 0.05 });
    footBox(0, 137, 14, 2.5, 0);
    // food stands along the promenade, facing the path
    for (const [key, x, z, ry] of [["funnel", -10, 140, -90], ["boudin", -10, 155, -90], ["snowball", 10, 140, 90], ["gatorstick", 10, 155, 90]]) {
      el("m-model", { src: natURL("stand-" + key), x, y: G0, z, ry });
      footBox(x + (x < 0 ? -1.1 : 1.1), z, 2.4, 3.4, 0);
    }
    // light poles and string lights over the promenade
    footBox(-11.2, 148, 3, 5, 0); footBox(10.6, 147, 2.6, 2.6, 0);   // Whack-a-Gator and Test Your Bite
    for (const z of [141, 147, 153]) for (const s of [-1, 1]) el("m-model", { src: natURL("fair-pole"), x: s * 4.5, y: G0, z, collide: "false" });
    for (const z of [141, 147, 153]) el("m-model", { src: natURL("fair-garland"), x: -4.5, y: G0 + 5.6, z, sx: 0.75, collide: "false", "cast-shadows": "false" });
    for (const s of [-1, 1]) for (const [z1, z2] of [[141, 147], [147, 153]])
      el("m-model", { src: natURL("fair-garland"), x: s * 4.5, y: G0 + 5.6, z: z1, ry: -90, sx: (z2 - z1) / 12, collide: "false", "cast-shadows": "false" });
    for (const [x, z] of [[-22, 147], [-34, 147], [22, 149], [36, 150], [-20, 168], [20, 170]]) el("m-model", { src: natURL("fair-pole"), x, y: G0, z, collide: "false" });
    // ride name signs: hung from a bar between two gold posts (painted into the city model when baked)
    const rideSign = (name, sub, x, z, w, y, bg, fg) => {
      text(name, { x, y: GROUND + y, z, ry: 180, width: w, height: 0.75, "font-size": 60, color: bg, "font-color": fg, emissive: 1, mount: "hang" });
      live(() => text(sub, { x, y: GROUND + y - 0.62, z: r2(z - 0.02), ry: 180, width: w + 0.8, height: 0.36, "font-size": 19, color: bg, "font-color": "#fff2c8", emissive: 0.7 }));   // stays a live label so its words show
      const top = y + 0.375 + 0.8;
      for (const s of [-1, 1]) cyl({ x: r2(x + s * (w / 2 + 0.45)), y: GROUND + top / 2, z: z + 0.07, radius: 0.07, height: r2(top), color: "#d9a33a", collide: "false", mat: "gold" });
    };
    rideSign("BAYOU EYE", "HOP IN AT THE BOTTOM  |  2 MIN LOOP", 0, 156.1, 4.2, 3.4, "#123a3a", "#7dfff0");
    rideSign("GATOR-GO-ROUND", "STEP ON WHILE IT TURNS", -28, 149.4, 4.6, 3.0, "#4a0f22", "#ffd27a");
    rideSign("GATOR DROP", "HOP ON WHILE IT'S BOARDING", 28, 153.8, 4.0, 3.6, "#2a1238", "#ff6ec7");
    live(() => { buildFerris(); buildCarousel(); buildDropTower(); buildWhack(); buildStriker(); });
    el("m-light", { type: "point", x: 0, y: 12, z: 156, color: "#ff9ad5", intensity: 1600, distance: 45, "cast-shadows": "false" });
    el("m-light", { type: "point", x: -28, y: 9, z: 158, color: "#ffd27a", intensity: 900, distance: 24, "cast-shadows": "false" });
  }

  // BAYOU EYE: 12 gondolas on a 14 m wheel, one loop every 2 minutes. Board at the bottom from the platform.
  function buildFerris() {
    const X = 0, Z = 163, HUB = GROUND + 18.2, R = 14, LOOP = 120000;
    el("m-model", { src: natURL("ferris-frame"), x: X, y: GROUND, z: Z });
    const spin = grp({ x: X, y: HUB, z: Z });
    el("m-attr-anim", { attr: "rz", start: 0, end: 360, duration: LOOP, loop: "true" }, spin);
    el("m-model", { src: natURL("ferris-rim"), collide: "false" }, spin);
    const cols = ["gondola-pink", "gondola-teal", "gondola-gold", "gondola-purple"];
    for (let k = 0; k < 12; k++) {
      const a = (270 + k * 30) * Math.PI / 180;
      const g = grp({ x: r2(Math.cos(a) * R), y: r2(Math.sin(a) * R) }, spin);
      el("m-attr-anim", { attr: "rz", start: 0, end: -360, duration: LOOP, loop: "true" }, g);   // stays level
      el("m-model", { src: natURL(cols[k % 4]), collide: "false" }, g);
      // solid MML surfaces that ride with the gondola, so avatars stand on real primitives (not the model mesh)
      const paint = ["#e0457a", "#1f9f9a", "#d9a21b", "#7a3cb0"][k % 4], GOLDC = "#d9a33a";
      box({ y: -3.08, width: 2.3, height: 0.2, depth: 1.7, color: "#8a6a48" }, g);                          // floor, top 2 cm above the model's
      for (const s of [-1, 1]) {
        box({ x: s * 1.1, y: -2.4, width: 0.06, height: 1.16, depth: 1.66, color: paint }, g);              // side walls, waist-high
        box({ x: s * 1.1, y: -1.8, width: 0.09, height: 0.09, depth: 1.7, color: GOLDC }, g);               // side top rails
      }
      box({ y: -2.4, z: 0.8, width: 2.14, height: 1.16, depth: 0.06, color: paint }, g);                    // back wall
      box({ y: -1.8, z: 0.8, width: 2.26, height: 0.09, depth: 0.09, color: GOLDC }, g);                    // back top rail
      box({ y: -2.72, z: -0.8, width: 2.14, height: 0.52, depth: 0.06, color: paint }, g);                  // low front wall: hop in over it
      box({ y: -2.44, z: -0.8, width: 2.26, height: 0.09, depth: 0.09, color: GOLDC }, g);                  // front top rail
    }
    footBox(X, Z - 1.5, 18, 11, 0);
  }

  // GATOR-GO-ROUND: always turning slowly. Step onto the deck from the boarding ring.
  function buildCarousel() {
    const X = -28, Z = 158, LOOP = 45000;
    el("m-model", { src: natURL("carousel-base"), x: X, y: GROUND, z: Z });
    const rot = grp({ x: X, y: GROUND, z: Z });
    el("m-attr-anim", { attr: "ry", start: 0, end: 360, duration: LOOP, loop: "true" }, rot);
    el("m-model", { src: natURL("carousel"), collide: "false" }, rot);
    cyl({ y: 0.45, radius: 6.5, height: 0.3, color: "#ffffff", opacity: 0 }, rot);         // the deck you stand on
    cyl({ y: 2.85, radius: 1.1, height: 4.5, color: "#ffffff", opacity: 0 }, rot);          // centre column
    let k = 0;
    for (const [rr, off] of [[3.2, 0], [5.0, 22.5]]) for (let i = 0; i < 8; i++, k++) {
      const deg = i * 45 + off, a = deg * Math.PI / 180;
      const seat = grp({ x: r2(Math.cos(a) * rr), y: 0.6, z: r2(Math.sin(a) * rr), ry: r2(90 - deg) }, rot);
      const bob = grp({}, seat);
      el("m-attr-anim", { attr: "y", start: 0, end: 0.35, duration: 2600, loop: "true", "ping-pong": "true", easing: "easeInOutSine", "start-time": (k * 330) % 2600 }, bob);
      el("m-model", { src: natURL((i + (rr > 4 ? 1 : 0)) % 2 ? "carousel-gator" : "carousel-frog"), collide: "false" }, bob);
    }
    footBox(X, Z, 17, 17, 0);
  }

  // GATOR DROP: the ring climbs 26 m, hangs, then drops. Step on during BOARDING.
  function buildDropTower() {
    const X = 28, Z = 160, REST = GROUND + 0.55, TOP = 26;
    el("m-model", { src: natURL("drop-tower"), x: X, y: GROUND, z: Z, collide: "false" });
    box({ x: X, y: GROUND + 16.5, z: Z, width: 2.4, height: 33, depth: 2.4, color: "#ffffff", opacity: 0 });     // the tower itself
    cyl({ x: X, y: GROUND + 0.15, z: Z, radius: 4.8, height: 0.3, color: "#ffffff", opacity: 0 });               // plinth
    const ring = grp({ x: X, y: REST, z: Z });
    el("m-model", { src: natURL("drop-ring"), collide: "false" }, ring);
    for (let k = 0; k < 12; k++) {          // floor sectors between the collar and the lip
      const deg = k * 30 + 15, a = deg * Math.PI / 180, rr = 2.78;
      ghost({ x: r2(Math.cos(a) * rr), y: -0.1, z: r2(Math.sin(a) * rr), ry: r2(90 - deg), width: 1.62, height: 0.2, depth: 1.9 }, ring);
    }
    for (let k = 0; k < 16; k++) {          // the low lip round the outside (hop over it to board)
      const deg = k * 22.5, a = deg * Math.PI / 180;
      ghost({ x: r2(Math.cos(a) * 3.75), y: 0.27, z: r2(Math.sin(a) * 3.75), ry: r2(90 - deg), width: 1.5, height: 0.55, depth: 0.12 }, ring);
    }
    cyl({ y: 0.95, radius: 1.85, height: 1.9, color: "#ffffff", opacity: 0 }, ring);
    const status = text("GATOR DROP - STARTING UP", { x: X, y: GROUND + 2.35, z: Z - 6.25, ry: 180, width: 5.0, height: 0.4, "font-size": 22, color: "#2a1238", "font-color": "#fff2c8", emissive: 0.8 });
    footBox(X, Z, 11, 13, 0);
    FAIR.drop = { ring, status, REST, TOP, phase: "board", until: now() + 15000 };
  }
  function dropTick() {
    const d = FAIR.drop; if (!d) return;
    const t = now(), left = Math.max(0, Math.ceil((d.until - t) / 1000));
    if (t >= d.until) {
      if (d.phase === "board") { d.phase = "lift"; d.until = t + 16000; playAnim(d.ring, "y", d.REST, d.REST + d.TOP, 16000, "easeInOutSine"); }
      else if (d.phase === "lift") { d.phase = "hold"; d.until = t + 2500 + Math.floor(Math.random() * 3500); }
      else if (d.phase === "hold") {
        d.phase = "drop"; d.until = t + 4200;
        playAnim(d.ring, "y", d.REST + d.TOP, d.REST + 1.6, 2600, "easeInQuad");                                  // a little slower than free fall, so riders stay on
        setTimeout(() => { if (FAIR.drop.phase === "drop") playAnim(d.ring, "y", d.REST + 1.6, d.REST, 1300, "easeOutQuad"); }, 2600);
      } else { d.phase = "board"; d.until = t + 15000; }
    }
    setT(d.status, d.phase === "board" ? "BOARDING - HOP ON THE RING  |  DROP IN " + left + "s" : d.phase === "lift" ? "GOING UP... HOLD ON" : d.phase === "hold" ? "HANG ON..." : "GATOR DROP!!!");
  }

  // WHACK-A-GATOR: one player at a time, 20 seconds, bop the gators as they pop up
  function buildWhack() {
    const X = -10, Z = 148, RY = 90;   // the booth model opens toward +z; turned to face the promenade
    const g = grp({ x: X, y: GROUND, z: Z, ry: RY });
    el("m-model", { src: natURL("whack-booth") }, g);
    const holes = [];
    for (let k = 0; k < 5; k++) {
      const h = grp({ x: r2(-1.4 + k * 0.7), y: 1.0, z: -0.45 }, g);
      const pop = grp({ y: -0.5 }, h);
      const gator = el("m-model", { src: natURL("whack-gator"), collide: "false" }, pop);
      holes.push({ k, pop, gator, upUntil: 0, hit: false });
    }
    const start = text("CLICK HERE TO PLAY", { y: 0.6, z: 0.03, width: 2.8, height: 0.42, "font-size": 26, color: "#0e2a18", "font-color": "#7dff8a", emissive: 0.9 }, g);
    const score = text("HIGH SCORE  -", { y: 3.32, z: -2.05, width: 3.6, height: 0.34, "font-size": 22, color: "#0e2a18", "font-color": "#ffd27a", emissive: 0.9 }, g);
    ANCHORS.whack = { parent: g, x: 0, y: 4.1, z: 0.9, ry: 0, w: 3.6 };
    const w = { g, holes, start, score, player: null, endAt: 0, points: 0, best: 0, bestName: "", timers: [] };
    FAIR.whack = w;
    onClick(start, cid => whackStart(cid));
    holes.forEach(h => onClick(h.gator, cid => whackHit(h, cid)));
  }
  function whackStart(cid) {
    const w = FAIR.whack;
    if (w.player != null && now() < w.endAt) return say(cid, "whack", w.player === cid ? "You're playing - bop the gators!" : nameOf(w.player) + " is playing - you're next in a few seconds", "info");
    w.player = cid; w.points = 0; w.endAt = now() + 20000; w.timers.forEach(clearTimeout); w.timers = [];
    say(cid, "whack", "GO! Bop the gators as they pop up", "good");
    let at = 900;
    while (at < 19400) {   // gators pop faster as the clock runs down
      const when = at, upFor = Math.round(1100 - (at / 19400) * 450);
      w.timers.push(setTimeout(() => {
        const free = w.holes.filter(h => h.upUntil < now());
        if (!free.length) return;
        const h = free[Math.floor(Math.random() * free.length)];
        h.hit = false; h.upUntil = now() + upFor;
        playAnim(h.pop, "y", -0.5, 0, 180, "easeOutBack");
        w.timers.push(setTimeout(() => { if (!h.hit) playAnim(h.pop, "y", 0, -0.5, 180, "easeInQuad"); }, upFor));
      }, when));
      at += 520 + Math.floor(Math.random() * 380) - Math.floor(at / 100);
    }
    const tick = () => { if (w.player !== cid) return; const left = Math.max(0, Math.ceil((w.endAt - now()) / 1000)); setT(w.start, nameOf(cid).toUpperCase().slice(0, 14) + "  " + w.points + "  |  " + left + "s"); if (left > 0) w.timers.push(setTimeout(tick, 500)); };
    tick();
    w.timers.push(setTimeout(() => {
      const pts = w.points, name = nameOf(cid);
      say(cid, "whack", "TIME! You bopped " + pts + (pts === 1 ? " gator" : " gators") + (pts > w.best ? " - NEW HIGH SCORE!" : ""), pts > w.best ? "good" : "info");
      if (pts > w.best) { w.best = pts; w.bestName = name; setT(w.score, "HIGH SCORE  " + pts + "  " + name.toUpperCase().slice(0, 16)); }
      setT(w.start, "LAST: " + name.toUpperCase().slice(0, 14) + " " + pts + "  |  CLICK TO PLAY");
      w.player = null;
    }, 20200));
  }
  function whackHit(h, cid) {
    const w = FAIR.whack;
    if (w.player !== cid || now() > w.endAt || h.hit || h.upUntil < now() - 150) return;   // a little grace for lag
    h.hit = true; h.upUntil = now(); w.points++;
    playAnim(h.pop, "y", 0, -0.5, 120, "easeInQuad");                                         // bonk!
    setT(w.start, nameOf(cid).toUpperCase().slice(0, 14) + "  " + w.points + "  |  " + Math.max(0, Math.ceil((w.endAt - now()) / 1000)) + "s");
  }

  function strikerSwing(cid) {
    const s = FAIR.striker, t = now();
    if (s.busy > t) return;
    if ((s.cd.get(cid) || 0) > t) return say(cid, "striker", "Catch your breath - try again in a moment", "bad");
    s.cd.set(cid, t + 4000); s.busy = t + 2600;
    // where the needle was when they clicked (allow ~150 ms for the click to reach us)
    const dt = docNow(), r = dt == null ? Math.random() : (((dt - 150) % s.METER) + s.METER) % s.METER / s.METER;
    const power = r < 0.5 ? r * 2 : 2 - r * 2;   // 0 at the left end, 1 at the right
    const bell = power >= 0.9, h = bell ? 7.45 : 0.9 + Math.pow(power, 1.3) * 6.0;
    const up = 450 + Math.round((h - 0.9) * 70);
    playAnim(s.puck, "y", 0.9, h, up, "easeOutQuad");
    setTimeout(() => playAnim(s.puck, "y", h, 0.9, 700, "easeInQuad"), up + (bell ? 350 : 80));

      setT(s.result, nameOf(cid).toUpperCase().slice(0, 12) + ": " + rank + (bell ? " DING!" : ""));

  // Reports where each player is about three times a second. It places the crew mascot over the head of every

  // carrying loot in the BANK JOB. Positions are in world-group space, so they follow wherever the build is placed.
  // Several probes: one big one over the whole city, one at the sign-up gate and a grid of smaller ones, in case
  // a player's app limits how far a probe reaches. Each report is turned into world-group space.
  const PROBE = { el: null, pos: new Map(), src: new Map(), seen: [0, 0, 0] };   // connectionId -> { x, y, z, ry }
  function probeAt(px, pz, range, interval, kind) {
    const pr = el("m-position-probe", { x: px, z: pz, range, interval });
    const onMove = e => {
      const d = e.detail || {}; if (d.connectionId == null) return;
      PROBE.seen[kind]++;
      let at;
      if (d.elementRelative && d.elementRelative.position) {
        const p = d.elementRelative.position;
        at = { x: px + (+p.x || 0), y: +p.y || 0, z: pz + (+p.z || 0), ry: +((d.elementRelative.rotation || {}).y) || 0 };
      } else {   // clients that only send the document-relative spot: turn it into world-group space
        const q = (d.documentRelative || d).position || d.position; if (!q) return;
        const a = (+W.getAttribute("ry") || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
        const dx = (+q.x || 0) - (+W.getAttribute("x") || 0), dz = (+q.z || 0) - (+W.getAttribute("z") || 0);
        at = { x: c * dx - s * dz, y: (+q.y || 0) - (+W.getAttribute("y") || 0), z: s * dx + c * dz, ry: +(((d.documentRelative || d).rotation || {}).y) - (+W.getAttribute("ry") || 0) || 0 };
      }
      PROBE.src.set(d.connectionId, pr);
      PROBE.pos.set(d.connectionId, at);
      iconMove(d.connectionId, at);
      carryMove(d.connectionId, at);
      roundupMove(d.connectionId, at);

  const heist = {

    const order = HOUSES.map((h, k) => ({ k, a: ang(h), r: Math.hypot(+h.g.getAttribute("x"), +h.g.getAttribute("z") - CZ) })).sort((p, q) => p.a - q.a);

      for (const k of out) HOUSES[k].terr = -1;
    }
    const inPlay = order.filter(o => HOUSES[o.k].terr !== -1);
    const want = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];   // north, east, south, west (z grows to the south)
    const diff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));

    for (let st = 0; st < inPlay.length; st++) {   // try every starting house for the first cut, keep the best fit

    const cx = r2(bw + 0.04);
    ctl("< LEFT", -cx, 0.08, "#9fd8e6", "left"); ctl("GO", 0, 0.08, "#4fe08f", "gas"); ctl("RIGHT >", cx, 0.08, "#9fd8e6", "right");
    ctl("BACK", -cx, -0.3, "#ffc857", "rev"); ctl("STOP", 0, -0.3, "#ff4d6a", "brake"); ctl("EXIT", cx, -0.3, "#f4ead8", "exit");
    car.dash = dash; car.dashHead = head; car.btn = btn; car.lit = null;
  }
  function dropDash(car) { if (car.dash) { car.dash.remove(); car.dash = null; car.dashHead = null; car.btn = null; car.lit = null; } }
  function dashStatus(car) {
    if (!car.dashHead) return;
    const sp = Math.round(Math.abs(car.v) * 3.6);
    const st = car.throttle > 0 ? "FORWARD" : car.throttle < 0 ? "REVERSE" : sp > 0 ? "SLOWING" : "STOPPED";
    const s = LABELS[car.kind] + "  |  " + st + (sp > 0 ? "  " + sp + " KM/H" : "");
    if (s !== car.shown) { car.shown = s; setT(car.dashHead, s); }
    const on = car.throttle > 0 ? "gas" : car.throttle < 0 ? "rev" : "brake";
    if (car.btn && car.lit !== on) {
      for (const k of ["gas", "rev", "brake"]) { const b = car.btn[k]; b.b.setAttribute("color", k === on ? "#ffffff" : b.colr); b.b.setAttribute("emissive", k === on ? "0.8" : "0"); }
      car.lit = on;
    }
  }
  // swamp buggy / truck (kept as car-0 .. car-11 for the controller and tests)
  function buggy(i, x, z, ry) {
    const color = CAR_COLORS[i % CAR_COLORS.length];
    const truck = KEN && !CONFIG.MODELS.buggy;
    vehicle("car-" + i, "truck", x, z, ry, g => {
      const parts = [];
      if (CONFIG.MODELS.buggy) parts.push(el("m-model", { src: CONFIG.MODELS.buggy, collide: "false" }, g));
      else if (BOATS) parts.push(el("m-model", { src: natURL(PICKUPS[i % PICKUPS.length]), collide: "false" }, g));   // modeled pickup, wheels on the road
      else if (truck) parts.push(el("m-model", { src: asset(TRUCKS[i % TRUCKS.length]), sx: 2, sy: 2, sz: 2, collide: "false" }, g));
      else {
        parts.push(box({ y: 1.1, width: 2.8, height: 0.3, depth: 4.6, color, collide: "false" }, g));
        parts.push(box({ y: 1.5, z: 1.75, width: 2.6, height: 0.5, depth: 1.1, color, collide: "false" }, g));
        for (const [wx, wz] of [[-1.4, 1.45], [1.4, 1.45], [-1.4, -1.45], [1.4, -1.45]])
          cyl({ x: wx, y: 0.55, z: wz, rz: 90, radius: 0.55, height: 0.5, color: "#141414", collide: "false" }, g);
      }
      return parts;
    });
  }
  function setCarTag(car) {
    const vis = car.driver == null ? "true" : "false";
    setT(car.tagF, car.free); setT(car.tagB, car.free);
    car.tagF.setAttribute("visible", vis); car.tagB.setAttribute("visible", vis);
  }
  function release(car) {
    car.driver = null; car.throttle = 0;   // it coasts to a stop
    dropDash(car); car.shown = "";
    setCarTag(car);
  }
  function claim(car, cid) {
    if (car.driver === cid) return say(cid, car.id, "Use the panel: GAS, LEFT, RIGHT", "info");
    if (car.driver != null) return say(cid, car.id, "Taken - " + nameOf(car.driver) + " is driving", "bad");
    for (const c of CARS) if (c.driver === cid) release(c);
    car.driver = cid; car.last = now();
    makeDash(car, cid);
    setCarTag(car);
    say(cid, car.id, car.kind === "truck" ? "Yours! Climb in the back, then hit GAS" : "Yours! Step aboard, then hit GAS", "good");
  }
  function control(car, cid, act) {
    if (car.driver !== cid) return;
    car.last = now();
    const turn = VSPEC[car.kind].turn;
    if (act === "gas") car.throttle = 1;
    else if (act === "rev") car.throttle = -1;
    else if (act === "brake") car.throttle = 0;
    else if (act === "left") car.tRy += turn;     // the vehicle eases round to the new heading
    else if (act === "right") car.tRy -= turn;
    else if (act === "exit") { release(car); say(cid, car.id, "Parked. Click it to drive again", "info"); return; }
    dashStatus(car);
  }
  function setCar(car) {
    for (const k of ["x", "y", "z", "ry"]) { const v = String(r2(car[k])); if (car.g.getAttribute(k) !== v) car.g.setAttribute(k, v); }
  }
  const onIsland = (x, z) => x > ISLAND.x1 + 1 && x < ISLAND.x2 - 1 && z > ISLAND.z1 + 1 && z < ISLAND.z2 - 1;
  const inSwamp = (x, z, pad) => Math.hypot(x, z - CZ) < SWAMP_R - pad;
  function blocked(x, z) {
    if (!inSwamp(x, z, 4)) return true;
    for (const f of FOOT) {
      if (f.r != null) { if (Math.hypot(x - f.cx, z - f.cz) < f.r + 1.6) return true; }
      else if (x > f.x1 - 1.8 && x < f.x2 + 1.8 && z > f.z1 - 1.8 && z < f.z2 + 1.8) return true;
    }
    return false;
  }
  // boats stay in open water: off the island, clear of the piers, inside the swamp
  function boatBlocked(x, z, rad) {
    if (!inSwamp(x, z, rad + 2)) return true;
    const m = rad * 0.6 + 2;
    if (x > ISLAND.x1 - m && x < ISLAND.x2 + m && z > ISLAND.z1 - m && z < ISLAND.z2 + m) return true;
    if (Math.abs(z - CZ) < 2 + rad * 0.45 && Math.abs(x) > HALF - m && Math.abs(x) < HALF + 104 + rad * 0.5) return true;
    return false;
  }
  function bumps(car, x, z) {   // don't drive through another vehicle
    const r1 = VSPEC[car.kind].rad;
    for (const o of CARS) if (o !== car && Math.hypot(o.x - x, o.z - z) < (r1 + VSPEC[o.kind].rad) * 0.7 && Math.hypot(o.x - x, o.z - z) < Math.hypot(o.x - car.x, o.z - car.z)) return true;
    return false;
  }
  // Smooth driving: 10 updates a second, a gentle start that builds up speed, gradual braking and coasting,
  // and turns that ease round to the new heading instead of snapping.
  const STEP = 0.1;
  function carTick() {
    const t = now();
    for (const car of CARS) {
      if (car.driver != null && car.throttle === 0 && t - car.last > 120000) release(car);
      const s = VSPEC[car.kind];
      const turning = Math.abs(car.tRy - car.ry) > 0.05, sinking = Math.abs(car.tY - car.y) > 0.01;
      if (!car.throttle && Math.abs(car.v) < 0.05 && !turning && !sinking) { car.v = 0; continue; }
      // speed: ease in from a standstill (starts very slow), then build to top speed
      if (car.throttle) {
        const target = car.throttle > 0 ? s.speed : s.rev;
        const same = Math.sign(target) === Math.sign(car.v) || Math.abs(car.v) < 0.05;
        if (same) {
          const ease = 0.2 + 0.8 * Math.min(1, Math.abs(car.v) / (s.speed * 0.35));
          const step = s.acc * ease * STEP;
          car.v = target > 0 ? Math.min(target, car.v + step) : Math.max(target, car.v - step);
        } else car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), s.brake * STEP);   // slow down before changing direction
      } else {
        const dec = (car.driver != null ? s.brake : s.drag) * STEP;                     // BRAKE (or coasting when parked)
        car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), dec);
      }
      // steering: turn toward the target heading; slower when barely moving
      if (turning) {
        const k = 0.35 + 0.65 * Math.min(1, Math.abs(car.v) / s.speed), d = car.tRy - car.ry, m = s.rate * k * STEP;
        car.ry = Math.abs(d) <= m ? car.tRy : car.ry + Math.sign(d) * m;
      }
      const rad = car.ry * Math.PI / 180;
      const nx = car.x + Math.sin(rad) * car.v * STEP, nz = car.z + Math.cos(rad) * car.v * STEP;
      if (Math.abs(car.v) > 0.01) {
        if ((s.land ? blocked(nx, nz) : boatBlocked(nx, nz, s.rad)) || bumps(car, nx, nz)) {
          car.throttle = 0; car.v = 0; car.tRy = car.ry; dashStatus(car);
          if (car.driver != null) say(car.driver, car.id, s.land ? "BONK! Steer away, then GAS" : "Too shallow - steer for open water", "bad");
          setCar(car);
          continue;
        }
        car.x = nx; car.z = nz;
      }
      if (s.land) { car.tY = onIsland(car.x, car.z) ? GROUND : -0.5; car.y += Math.sign(car.tY - car.y) * Math.min(Math.abs(car.tY - car.y), 0.06); }
      setCar(car);
      dashStatus(car);
    }
  }
  function resetCars() { for (const car of CARS) { release(car); car.x = car.home.x; car.z = car.home.z; car.ry = car.tRy = car.home.ry; car.v = 0; car.y = car.tY = VSPEC[car.kind].land ? GROUND : WATERLINE; setCar(car); } }
  // plaza and ring-road trucks cycle colours; hideout trucks match their team where Kenney has the colour
  const PICKUPS = ["pickup-red", "pickup-blue", "pickup-gold", "pickup-green"];
  const TRUCKS = ["truck-red", "truck-yellow", "truck-green", "truck-purple", "truck-green", "truck-red", "truck-yellow", "truck-purple", "truck-red", "truck-yellow", "truck-green", "truck-purple"];
  function buildCars() {
    [[188, -33], [180, -33], [188, 33], [180, 33]].forEach(([x, z], k) => buggy(k, x, VC.z + z, 90)); // Visitor Center, nose toward the street
    HIDEOUTS.forEach((h, i) => { // one beside each hideout, nose toward the inner road
      const rad = h.ry * Math.PI / 180, lx = -10, lz = 9;
      buggy(4 + i, h.x + lx * Math.cos(rad) + lz * Math.sin(rad), h.z - lx * Math.sin(rad) + lz * Math.cos(rad), h.ry);
    });
    // four more parked on the middle ring road
    [[20, CZ - 150, 90], [-20, CZ + 150, -90], [-150, CZ + 40, 180], [150, CZ - 40, 0]].forEach(([x, z, ry], k) => buggy(8 + k, x, z, ry));
  }

  /* =========================================================================
     ROUND FLOW, BIG SCREEN, HOST BANK
     ========================================================================= */
  function flash(msg) { NOTE = String(msg).slice(0, 70); NOTE_UNTIL = now() + 8000; paintScreen(); }
  function setActive(id) {
    if (ACTIVE) { show(ACTIVE, false); GAMES[ACTIVE].stop(); }
    ACTIVE = id;
    ROUND = [0, 0, 0, 0];
    if (id) { show(id, true); GAMES[id].start(); }
    paintScores(); paintScreen(); pushState();
  }
  function finishRound() {
    const id = ACTIVE;
    if (!id) return;
    const top = Math.max(...ROUND), winners = ROUND.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    const result = top <= 0 ? "NO POINTS SCORED" : winners.length > 1 ? "TIE: " + winners.map(i => TEAMS[i].name).join(" + ") : TEAMS[winners[0]].name + " WIN " + INFO[id].title + "!";
    const line = teamLine(ROUND);
    setActive(null);
    NOTE = result + "  |  " + line; NOTE_UNTIL = now() + 30000;
    paintScreen(); pushState();
  }
  function paintScreen() {
    const t = now(), note = NOTE_UNTIL > t ? NOTE : "";
    if (!ACTIVE) {
      setT(SCREEN.title, "INTERMISSION");
      setT(SCREEN.kind, note || "THE HOST WILL START THE NEXT GAME SOON");
      setT(SCREEN.what, KEN ? "Sign up at the dock gate - you're put on a crew. Grab a truck - click it to drive." : "Sign up at the dock gate - you're put on a crew. Grab a buggy - click its hood to drive.");
      setT(SCREEN.where, "TONIGHT: BANK JOB  |  GATOR PIT  |  LUCKY WHEEL  |  TURF WAR");
      setT(SCREEN.status, TEAM.size + " PLAYERS SIGNED UP");
      return;
    }
    const i = INFO[ACTIVE];
    setT(SCREEN.title, i.title);
    setT(SCREEN.kind, note ? "HOST: " + note : i.kind);
    setT(SCREEN.what, i.what);
    setT(SCREEN.where, i.where);
    setT(SCREEN.status, GAMES[ACTIVE].status(t));
  }
  function pushState() {
    const t = now(), s = { boot: BOOT, active: ACTIVE, players: TEAM.size, probe: PROBE.pos.size, seen: PROBE.seen, tracked: Array.from(TEAM.keys()).filter(c => PROBE.pos.has(c)).length, crews: COUNTS.slice(), series: SERIES.slice(), round: ROUND.slice(), note: NOTE_UNTIL > t ? NOTE : "", cars: CARS.filter(c => c.driver != null).length, games: {} };
    for (const k in GAMES) s.games[k] = GAMES[k].status(t);
    document.getElementById("hb-state").setAttribute("data-state", JSON.stringify(s));
  }

  const FAILS = new Map();
  function hostCommand(cmd, e) {
    const d = (e && e.detail) || {}, p = d.params || {};
    const cid = d.connectionId, key = d.key != null ? d.key : p.key;
    const f = FAILS.get(cid) || { n: 0, until: 0 };
    if (f.until > now()) return;
    if (String(key) !== CONFIG.HOST_KEY) {
      f.n++; if (f.n >= 5) { f.until = now() + 60000; f.n = 0; }
      FAILS.set(cid, f);
      return;
    }
    FAILS.delete(cid);
    if (cmd === "stop") setActive(null);
    else if (cmd === "note") { NOTE = String(d.text != null ? d.text : p.text || "").replace(/[^ -~]/g, "").slice(0, 70); NOTE_UNTIL = NOTE ? now() + 45000 : 0; paintScreen(); }
    else if (cmd === "reset") { SERIES.fill(0); paintScores(); }
    else if (cmd === "cars") resetCars();
    else if (GAMES[cmd]) setActive(cmd); // starting the live game again restarts the round
    pushState();
  }
  function hookHost() {
    for (const cmd of ["heist", "arena", "casino", "turf", "stop", "note", "reset", "cars"])
      document.getElementById("hb-" + cmd).addEventListener("click", e => hostCommand(cmd, e));
  }

  window.addEventListener("disconnected", e => {
    const cid = e.detail && e.detail.connectionId;
    if (cid == null) return;
    for (const g of Object.values(GAMES)) g.leave(cid);
    for (const car of CARS) if (car.driver === cid) release(car);
    for (const [k, v] of SAYS) if (k.startsWith(cid + "|")) { v.nodes.forEach(n => n.remove()); SAYS.delete(k); }
    const y = YOU.get(cid); if (y) { y.remove(); YOU.delete(cid); }
    iconHide(cid); PROBE.pos.delete(cid);
    FAILS.delete(cid);
    if (TEAM.has(cid)) { COUNTS[TEAM.get(cid)]--; TEAM.delete(cid); NAME.delete(cid); paintRoster(); }
    pushState();
  });

  /* =========================================================================
     BUILD + START
     ========================================================================= */
  if (BAKED) for (const n of BAKE_NAMES) natModel(n, 0, 0, 0, 1, 0, true); // the detailed textured city
  stat(buildGround);
  stat(buildRoads);
  stat(buildPlaza);
  stat(buildVisitorCenter);
  stat(buildCasino);
  stat(buildArena);
  stat(buildDowntown);
  stat(buildNeonRow);
  stat(buildHideouts);
  stat(buildLandmarks);
  stat(buildNature);
  stat(buildAirboats);
  buildClouds();
  buildCars();
  stat(buildOuter);
  buildOptional();
  buildHouses();   // doors + claim buttons, after every district has placed its houses
  hookPrompts();
  probeStart();
  hookArena();
  hookHost();
  onClick(document.getElementById("vault"), cid => heist.grab(cid));

  setInterval(carTick, 100);
  setInterval(() => {
    const t = now();
    if (ACTIVE) GAMES[ACTIVE].tick(t);
    for (const [k, v] of SAYS) if (t >= v.until) { v.nodes.forEach(n => n.remove()); SAYS.delete(k); }
    paintScreen();
    pushState();
  }, 1000);
  paintRoster();
  paintScores();
  setActive(null);
})();
</script>
