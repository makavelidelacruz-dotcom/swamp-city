<!--
  CHAOS TRIALS: SWAMP CITY
  A Grand Theft Auto style MML world for 4 teams and 50+ players.
  Built on the same patterns as Grand Theft Dino: team check-in prompts, a hidden host bank
  driven by the external host controller, per-player messages with visible-to, and one
  game running at a time.

  Games:   BANK JOB (heist) | BAYOU RUN (race) | GATOR PIT (arena) | LUCKY WHEEL (casino) | TURF WAR (turf)
  Teams:   GATORS (green) | HERONS (blue) | BULLFROGS (gold) | COTTONMOUTHS (purple)
  Rides:   8 drivable swamp buggies (amphibious) + 3 airboats on a loop around the city

  Everything is built from MML primitives, so this one file runs on its own.
  Change HOST_KEY below before your event, and use the same code in the controller.
-->
<m-group id="world"></m-group>
<m-group id="hostbank" visible="false">
  <m-group id="hb-heist"></m-group>
  <m-group id="hb-race"></m-group>
  <m-group id="hb-arena"></m-group>
  <m-group id="hb-casino"></m-group>
  <m-group id="hb-turf"></m-group>
  <m-group id="hb-stop"></m-group>
  <m-group id="hb-note"></m-group>
  <m-group id="hb-reset"></m-group>
  <m-group id="hb-cars"></m-group>
  <m-group id="hb-state" data-state="{}" data-roster="[[],[],[],[]]"></m-group>
</m-group>
<script>
(function () {
  "use strict";

  /* =========================================================================
     CONFIG - the only part you should need to edit
     ========================================================================= */
  const CONFIG = {
    HOST_KEY: "2164fdc8f46047cdde8b2b0d4a83e3cc", // paste this into the controller's Host code box
    DETAIL: "high",          // "low" cuts trees, reeds and lily pads roughly in half
    LIGHT_LEVEL: 1,          // brightness of every light in the world, 0 to 1. 0 turns them all off
    // Optional: folder URL that holds your princess castle GLBs (citadel_grounds.glb, citadel_walls.glb,
    // citadel_keep.glb, citadel_crown.glb). When set, the castle appears on Queen's Isle in the swamp.
    CASTLE_BASE: "",
    // Optional: embed other MML documents (for example the Spire) with m-frame.
    // Example: [{ src: "wss://run.mmleditor.com/XXXX", x: 0, y: 0, z: -420, ry: 0 }]
    FRAMES: [],
    // Optional CC0 GLB swaps. Leave blank to use the built-in primitive versions.
    MODELS: { buggy: "", airboat: "", gator: "" },
    // Kenney CC0 models (trucks, Voodoo Quarter townhouses, warehouses, clouds, coins, fountains, fair tents).
    // false = everything built from primitives, like the first version.
    KENNEY: true,
    // Where those models load from. By default they come straight from Kenney's public GitHub repos
    // (pinned to a fixed version). To host the included swamp-city-assets pack yourself, either set
    // ASSET_HOST to the folder URL, or paste one URL per file into ASSET_URLS (handy for mmlstorage).
    ASSET_HOST: "https://raw.githubusercontent.com/makavelidelacruz-dotcom/swamp-city/main/swamp-city-assets/",
    ASSET_URLS: {},
    // Swamp nature models from your AllModels.blend (Quaternius "Ultimate Stylized Nature", CC0):
    // dead swamp trees, leafy trees, bushes, tall grass and rocks. These only load once the
    // swamp-city-assets pack is hosted (ASSET_HOST or ASSET_URLS); until then the primitive trees stay.
    NATURE: true,
    // Old-town houses and props from your Medieval Village MegaKit (Quaternius, CC0): four houses built
    // from the kit's pieces, plus wagons, crates, wooden fences and iron railings. Also needs the hosted pack.
    MEDIEVAL: true,
    // Brick city buildings and street props from your Downtown City MegaKit (Quaternius, CC0):
    // three ready-made buildings, bollards, planters, rooftop AC units and manhole covers. Also needs the hosted pack.
    DOWNTOWN: true,
    // Textured streets (asphalt with painted lines, sidewalks with curbs, crosswalk intersections),
    // a grass lawn over the whole island and paved plaza stones. Also needs the hosted pack.
    STREETS: true,
    // Detailed textured versions of every building, the bank, the casino, the arena and the signs
    // (baked from this file into a few models). Also needs the hosted pack.
    BAKED: true
  };

  /* =========================================================================
     PALETTE AND TEAMS
     ========================================================================= */
  const INK = "#0b1a24", PAPER = "#f4ead8", AMBER = "#ffc857", SKY = "#9fd8e6", NEON = "#2ff3e0", PINK = "#ff4fa3";
  const KIND = { info: "#0b1a24", good: "#0f3b2c", bad: "#4a1424" };
  const TEAMS = [
    { name: "GATORS", color: "#4fe08f", tone: "GREEN" },
    { name: "HERONS", color: "#3fd0ff", tone: "BLUE" },
    { name: "BULLFROGS", color: "#ffc23d", tone: "GOLD" },
    { name: "COTTONMOUTHS", color: "#c48bff", tone: "PURPLE" }
  ];
  const WOOD = "#6b4a2b", WOOD_D = "#3f2b1a", ASPHALT = "#2a2c2f", STONE = "#5c5547", MOSS = "#8f9c7a";

  /* =========================================================================
     CITY GRID (meters). North is -z. Grid centre CZ sits on the bank vault, so
     all four hideouts are the same distance from the loot.
     ========================================================================= */
  const CZ = -20;
  const HALF = 215; // island half-width (the first version was 108)
  const ISLAND = { x1: -HALF, x2: HALF, z1: CZ - HALF, z2: CZ + HALF };
  const ROAD_X = [-200, -150, -100, -50, 50, 100, 150, 200];
  const ROAD_Z = ROAD_X.map(v => CZ + v);
  const HIDEOUTS = [ // team index -> centre and facing (front faces the road toward downtown)
    { x: 125, z: CZ - 125, ry: 0 },    // GATORS - north-east
    { x: -125, z: CZ + 125, ry: 180 }, // HERONS - south-west
    { x: 125, z: CZ + 125, ry: 180 },  // BULLFROGS - south-east
    { x: -125, z: CZ - 125, ry: 0 }    // COTTONMOUTHS - north-west
  ];

  /* Kenney CC0 asset table: name -> [repo, file] */
  const RAW = {
    racing: "https://raw.githubusercontent.com/KenneyNL/starter-kit-racing/2f2e5f2646dda89cb21d4e8539bab60c6e955dc8/models/",
    city: "https://raw.githubusercontent.com/KenneyNL/starter-kit-city-builder/4535092b740b378b700efd9df9e27a631815b84a/models/",
    plat: "https://raw.githubusercontent.com/KenneyNL/starter-kit-3d-platformer/3fa8a04b1c01ab23db43123d4ce814a34c3fc7f0/models/"
  };
  const ASSET = {
    "truck-red": ["racing", "vehicle-truck-red.glb"], "truck-yellow": ["racing", "vehicle-truck-yellow.glb"],
    "truck-green": ["racing", "vehicle-truck-green.glb"], "truck-purple": ["racing", "vehicle-truck-purple.glb"],
    "motorcycle": ["racing", "vehicle-motorcycle.glb"], "tents": ["racing", "decoration-tents.glb"],
    "building-a": ["city", "building-small-a.glb"], "building-b": ["city", "building-small-b.glb"],
    "building-c": ["city", "building-small-c.glb"], "building-d": ["city", "building-small-d.glb"],
    "garage": ["city", "building-garage.glb"], "fountain": ["city", "pavement-fountain.glb"],
    "cloud": ["plat", "cloud.glb"], "coin": ["plat", "coin.glb"]
  };
  const KB_H = { "building-a": 0.95, "building-b": 1.63, "building-c": 1.75, "building-d": 1.0 }; // model heights per unit
  function asset(name) {
    if (CONFIG.ASSET_URLS[name]) return CONFIG.ASSET_URLS[name];
    if (CONFIG.ASSET_HOST) return CONFIG.ASSET_HOST.replace(/\/?$/, "/") + name + ".glb";
    const a = ASSET[name];
    return RAW[a[0]] + a[1];
  }
  const KEN = !!CONFIG.KENNEY;
  const NATURE_NAMES = ["deadtree-1", "deadtree-2", "deadtree-3", "deadtree-4", "deadtree-5", "deadtree-6", "deadtree-7", "deadtree-8", "deadtree-9", "deadtree-10",
    "normaltree-1", "normaltree-2", "normaltree-3", "bush", "bush-large", "bush-large-flowers", "bush-small-flowers", "plant-flowers", "grass-large",
    "rock-1", "rock-2", "rock-3", "rock-4", "rock-5"];
  const NAT = !!CONFIG.NATURE && (!!CONFIG.ASSET_HOST || NATURE_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  function natURL(name) { return CONFIG.ASSET_URLS[name] || CONFIG.ASSET_HOST.replace(/\/?$/, "/") + name + ".glb"; }
  const MED_DIM = { "med-house": [8.4, 10], "med-townhouse": [5.8, 7.8], "med-hall": [10, 12.6], "med-cottage": [5.8, 5.8] }; // footprints incl. roof overhang
  const MED_NAMES = Object.keys(MED_DIM).concat(["med-wagon", "med-crate", "med-fence", "med-ironfence"]);
  const MED = !!CONFIG.MEDIEVAL && (!!CONFIG.ASSET_HOST || MED_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const DT_DIM = { "dt-large": [20.6, 16.6], "dt-medium": [15.1, 13.1], "dt-small": [12.5, 14.5] };
  const DT_NAMES = Object.keys(DT_DIM).concat(["dt-acunit", "dt-bollard", "dt-planter", "dt-manhole"]);
  const DT = !!CONFIG.DOWNTOWN && (!!CONFIG.ASSET_HOST || DT_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const ST_NAMES = ["road-seg-34", "road-seg-84", "road-seg-4", "road-cross", "ground-grass", "plaza-pavers"];
  const ST = !!CONFIG.STREETS && (!!CONFIG.ASSET_HOST || ST_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const BAKE_NAMES = ["city-a", "city-b", "city-c", "city-d", "city-e"];
  const BAKE_EXPORT = !!CONFIG.BAKE_EXPORT; // used only when generating the baked models
  function natModel(name, x, y, z, s, ry, collide) {
    return el("m-model", { src: natURL(name), x: r2(x), y: r2(y), z: r2(z), ry: Math.round(ry), sx: r2(s), sy: r2(s), sz: r2(s), collide: collide ? "true" : "false", "cast-shadows": "false" });
  }

  const W = document.getElementById("world");
  const FOOT = []; // car blockers: {x1,x2,z1,z2} or {cx,cz,r}
  let seed = 7;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const LOW = CONFIG.DETAIL === "low";
  // the baked city matches the full-detail layout with every add-on on, so it only switches on in that setup
  const BAKED = !BAKE_EXPORT && !!CONFIG.BAKED && !LOW && KEN && NAT && MED && DT && ST && (!!CONFIG.ASSET_HOST || BAKE_NAMES.every(n => CONFIG.ASSET_URLS[n]));
  const now = () => Date.now();
  const r2 = n => Math.round(n * 100) / 100;

  /* =========================================================================
     ELEMENT HELPERS
     ========================================================================= */
  function el(tag, attrs, parent) {
    if (tag === "m-light") { // every light is capped at LIGHT_LEVEL (never above 1)
      const lvl = Math.max(0, Math.min(1, Number(CONFIG.LIGHT_LEVEL) || 0));
      attrs = Object.assign({}, attrs, { intensity: lvl, enabled: lvl > 0 ? "true" : "false" });
    }
    const e = document.createElement(tag);
    const hints = attrs && (attrs.mat || attrs.mount) ? { mat: attrs.mat, mount: attrs.mount, drop: attrs.drop, back: attrs.back } : null;
    for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null && !HINT_KEYS[k]) e.setAttribute(k, String(attrs[k]));
    if (STATIC && BAKEABLE[tag]) {
      if (BAKE_EXPORT) { e.setAttribute("data-bake", "1"); if (hints) for (const k in hints) if (hints[k] != null) e.setAttribute("data-" + k, String(hints[k])); }
      else if (BAKED) return e; // drawn by the textured city models instead
    }
    (parent || W).appendChild(e);
    return e;
  }
  let STATIC = false;
  const BAKEABLE = { "m-cube": 1, "m-cylinder": 1, "m-sphere": 1, "m-label": 1, "m-plane": 1 };
  const HINT_KEYS = { mat: 1, mount: 1, drop: 1, back: 1 };
  const stat = fn => { const p = STATIC; STATIC = true; try { return fn(); } finally { STATIC = p; } };
  const live = fn => { const p = STATIC; STATIC = false; try { return fn(); } finally { STATIC = p; } };
  const grp = (a, p) => el("m-group", a, p);
  const box = (a, p) => el("m-cube", Object.assign({ "cast-shadows": "false" }, a), p);
  const cyl = (a, p) => el("m-cylinder", Object.assign({ "cast-shadows": "false" }, a), p);
  const sph = (a, p) => el("m-sphere", Object.assign({ "cast-shadows": "false", collide: "false" }, a), p);
  const text = (content, a, p) => el("m-label", Object.assign({ content, alignment: "center", color: INK, "font-color": PAPER, emissive: 0.35, collide: "false" }, a), p);
  const glow = (a, p) => el("m-label", Object.assign({ content: "", emissive: 0.9, collide: "false" }, a), p);
  const setT = (node, s) => { if (node && node.getAttribute("content") !== s) node.setAttribute("content", s); };
  const onClick = (nodes, fn) => (Array.isArray(nodes) ? nodes : [nodes]).forEach(n => n.addEventListener("click", e => {
    const cid = e.detail && e.detail.connectionId;
    if (cid != null) fn(cid, e);
  }));
  function footBox(cx, cz, w, d, ry) {
    const side = Math.abs(Math.round(ry || 0)) % 180 === 90;
    const hw = (side ? d : w) / 2, hd = (side ? w : d) / 2;
    FOOT.push({ x1: cx - hw, x2: cx + hw, z1: cz - hd, z2: cz + hd });
  }

  /* =========================================================================
     BUILDINGS
     ========================================================================= */
  const WINDOWS = ["#ffd98a", "#ffe9b8", "#8fd3ff", "#ffb36b", "#1d2a33"];
  function building(o) {
    const g = grp({ x: o.x, y: 0, z: o.z, ry: o.ry || 0 });
    const w = o.w, d = o.d, h = o.h, base = o.stilts ? 1.8 : 0.1;
    if (o.stilts) {
      for (const sx of [-1, 1]) for (const sz of [-1, 1])
        cyl({ x: sx * (w / 2 - 0.5), y: (base - 1.1) / 2, z: sz * (d / 2 - 0.5), radius: 0.28, height: base + 1.1, color: WOOD_D, mat: "log" }, g);
      box({ y: base - 0.1, z: d / 2 + 1.2, width: w * 0.7, height: 0.2, depth: 2.4, color: WOOD, mat: "planks" }, g); // porch
      if (!o.lite) for (let s = 0; s < 3; s++) box({ y: 0.3 + s * 0.5, z: d / 2 + 2.9 + (2 - s) * 0.5, width: 2, height: 0.5, depth: 0.5, color: WOOD, mat: "planks" }, g); // steps
    }
    box({ y: base + h / 2, width: w, height: h, depth: d, color: o.color, mat: o.wall || (o.stilts ? "siding" : "plaster") }, g);
    box({ y: base + h + 0.15, width: w + 0.5, height: 0.3, depth: d + 0.5, color: o.trim || "#2b2b2b", collide: "false", mat: "cornice" }, g);
    if (o.roof === "gable") {
      const a = 24, half = w / 2 + 0.4, len = half / Math.cos(a * Math.PI / 180);
      for (const s of [-1, 1])
        box({ x: s * half / 2, y: base + h + 0.3 + half / 2 * Math.tan(a * Math.PI / 180), width: len, height: 0.25, depth: d + 0.8, rz: -s * a, color: o.roofColor || "#5a3b2a", collide: "false", mat: o.stilts ? "shingle" : "tile" }, g);
    }
    const floors = Math.min(o.maxFloors || 99, Math.max(1, Math.floor((h - 0.6) / 3.2)));
    for (let f = 0; f < floors; f++) {
      const wc = WINDOWS[Math.floor(rand() * WINDOWS.length)];
      glow({ y: base + 1.9 + f * 3.2, z: d / 2 + 0.03, width: w * 0.74, height: 1.1, color: wc, emissive: 0.55, mat: "window" }, g);
      if (o.side !== false) glow({ x: w / 2 + 0.03, y: base + 1.9 + f * 3.2, ry: 90, width: d * 0.7, height: 1.1, color: wc, emissive: 0.55, mat: "window" }, g);
    }
    box({ y: base + 1.35, z: d / 2 + 0.06, width: 1.8, height: 2.7, depth: 0.12, color: "#1c1410", collide: "false", mat: "door" }, g);
    if (o.balcony && floors >= 2) {
      box({ y: base + 3.25, z: d / 2 + 0.7, width: w * 0.8, height: 0.18, depth: 1.4, color: "#2b2b2b", mat: "iron" }, g);
      box({ y: base + 3.8, z: d / 2 + 1.38, width: w * 0.8, height: 0.9, depth: 0.06, color: "#151515", collide: "false", mat: "railing" }, g);
    }
    if (o.sign) {
      text(o.sign, { y: base + h + 1.1, z: d / 2 - 0.2, width: Math.min(w * 0.95, o.sign.length * 0.62 + 1.2), height: 1.3, "font-size": 85, color: "#120d10", "font-color": o.signColor || PINK, emissive: 0.9, mount: "roof", drop: r2(1.1 - 0.65 - 0.3) }, g);
    }
    footBox(o.x, o.z, w, d, o.ry);
    return g;
  }

  function tower(o) {
    const g = grp({ x: o.x, y: 0, z: o.z, ry: o.ry || 0 });
    const w = o.w, d = o.d, h = o.h;
    box({ y: h / 2 + 0.1, width: w, height: h, depth: d, color: o.color, mat: "concrete" }, g);
    const glass = o.glass || "#7fb8c9";
    glow({ y: h / 2 + 1, z: d / 2 + 0.04, width: w * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    glow({ y: h / 2 + 1, x: w / 2 + 0.04, ry: 90, width: d * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    glow({ y: h / 2 + 1, x: -w / 2 - 0.04, ry: -90, width: d * 0.82, height: h - 3, color: glass, emissive: 0.25, mat: "curtain" }, g);
    for (let y = 4; y < h - 1; y += 4) box({ y, width: w + 0.3, height: 0.35, depth: d + 0.3, color: o.band || "#3a4148", collide: "false", mat: "metal" }, g);
    box({ y: h + 0.4, width: w + 0.6, height: 0.6, depth: d + 0.6, color: "#22262a", collide: "false", mat: "cornice" }, g);
    cyl({ x: w * 0.25, y: h + 2.2, z: -d * 0.2, radius: 1.3, height: 3, color: "#7a5b3a", collide: "false", mat: "tank" }, g); // water tank
    cyl({ x: -w * 0.25, y: h + 4, radius: 0.08, height: 7, color: "#aaaaaa", collide: "false", mat: "steel" }, g);   // antenna
    sph({ x: -w * 0.25, y: h + 7.6, radius: 0.35, color: "#ff3b3b", mat: "beacon" }, g);
    if (o.sign) text(o.sign, { y: h - 1.5, z: d / 2 + 0.1, width: w * 0.9, height: 1.6, "font-size": 110, color: "#120d10", "font-color": o.signColor || NEON, emissive: 0.9, mount: "wall", back: 0.1 }, g);
    if (DT) for (let k = 0; k < 3; k++) el("m-model", { src: natURL("dt-acunit"), x: r2(-w * 0.3 + k * w * 0.22), y: h + 0.7, z: r2(d * 0.25), sx: 1.8, sy: 1.8, sz: 1.8, collide: "false", "cast-shadows": "false" }, g);
    box({ y: 1.6, z: d / 2 + 0.08, width: 3.5, height: 3.2, depth: 0.12, color: "#10161a", collide: "false", mat: "glassdoor" }, g);
    footBox(o.x, o.z, w, d, o.ry);
    return g;
  }

  function tree(x, z, s, inWater) {
    if (NAT) {
      if (!inWater) return natModel("normaltree-" + (1 + Math.floor(rand() * 3)), x, 0.1, z, s * 1.35, rand() * 360, true);
      if (rand() < 0.65) return natModel("deadtree-" + (1 + Math.floor(rand() * 10)), x, -1.1, z, s * (1.5 + rand() * 0.6), rand() * 360, true);
    }
    const y0 = inWater ? -1.1 : 0.1;
    cyl({ x, y: y0 + 0.6 * s, z, radius: 0.95 * s, height: 1.2 * s, color: "#4a3a2a", collide: "false" });
    cyl({ x, y: y0 + 4 * s, z, radius: 0.36 * s, height: 7.6 * s, color: "#5a4632" });
    sph({ x, y: y0 + 7.2 * s, z, radius: 2.8 * s, sy: 0.42, color: "#3c5a2e" });
    sph({ x: x + 0.6 * s, y: y0 + 8.5 * s, z: z - 0.4 * s, radius: 2 * s, sy: 0.45, color: "#46663a" });
    if (!LOW) for (let m = 0; m < 2; m++) {
      const a = rand() * Math.PI * 2, rr = 1.6 * s;
      box({ x: x + Math.cos(a) * rr, y: y0 + 5.6 * s, z: z + Math.sin(a) * rr, width: 0.25, height: 2.2 * s, depth: 0.08, color: MOSS, opacity: 0.85, collide: "false" });
    }
  }

  function lamp(x, z) {
    cyl({ x, y: 2.6, z, radius: 0.09, height: 5, color: "#1b1b1b", collide: "false", mat: "iron" });
    sph({ x, y: 5.15, z, radius: 0.32, color: "#ffe9a8", mat: "globe" });
  }

  /* =========================================================================
     GROUND, WATER, ROADS
     ========================================================================= */
  function buildGround() {
    box({ y: -1.3, z: CZ, width: 1500, height: 0.4, depth: 1500, color: "#2b2418", mat: "mud" });                         // swamp mud (walkable)
    box({ y: -0.45, z: CZ, width: 1500, height: 0.08, depth: 1500, color: "#2d4a3a", opacity: 0.82, collide: "false", mat: "water" }); // water
    box({ y: ST ? -0.58 : -0.5, z: CZ, width: ISLAND.x2 - ISLAND.x1, height: 1.2, depth: ISLAND.z2 - ISLAND.z1, color: "#3d4a2c", mat: "bank" }); // island
    if (ST) natModel("ground-grass", 0, 0.11, CZ, 1, 0, true);                                                                // grass lawn
    // boardwalk rim around the island
    const rim = (x, z, w, d) => box({ x, y: 0.16, z, width: w, height: 0.12, depth: d, color: WOOD, mat: "boardwalk" });
    rim(0, ISLAND.z1 + 1.5, 2 * HALF, 3); rim(0, ISLAND.z2 - 1.5, 2 * HALF, 3);
    rim(ISLAND.x1 + 1.5, CZ, 3, 2 * HALF); rim(ISLAND.x2 - 1.5, CZ, 3, 2 * HALF);
    for (let i = 0; i < Math.floor(2 * HALF / 5.4); i++) cyl({ x: ISLAND.x1 + 2 + i * 5.4, y: -0.4, z: ISLAND.z2 + 0.3, radius: 0.2, height: 1.4, color: WOOD_D, collide: "false", mat: "log" });
  }

  function buildRoads() {
    const L = 2 * HALF - 4;
    if (ST) {
      const segs = [[-(HALF - 5), 4]];
      for (let k = 0; k < ROAD_X.length - 1; k++) segs.push([(ROAD_X[k] + ROAD_X[k + 1]) / 2, ROAD_X[k + 1] - ROAD_X[k] - 16]);
      segs.push([HALF - 5, 4]);
      for (const r of ROAD_X) for (const [c, len] of segs) {

  /* =========================================================================
     NATURE: cypress, reeds, lily pads, gators
     ========================================================================= */
  function gatorModel(x, y, z, ry, s, color, mat) {
    const g = grp({ x, y, z, ry, sx: s, sy: s, sz: s });
    if (CONFIG.MODELS.gator) { el("m-model", { src: CONFIG.MODELS.gator, collide: "false" }, g); return g; }
    const c = color || "#4b5e37", m = mat || "gatorskin";
    box({ width: 0.9, height: 0.35, depth: 2.4, color: c, collide: "false", mat: m }, g);
    box({ z: 1.55, y: -0.02, width: 0.6, height: 0.28, depth: 0.9, color: c, collide: "false", mat: m }, g);
    box({ z: 2.15, y: -0.05, width: 0.42, height: 0.18, depth: 0.6, color: c, collide: "false", mat: m }, g);
    sph({ x: 0.2, y: 0.17, z: 1.4, radius: 0.09, color: "#e6d35a", mat: "eye" }, g);
    sph({ x: -0.2, y: 0.17, z: 1.4, radius: 0.09, color: "#e6d35a", mat: "eye" }, g);
    box({ z: -1.8, width: 0.55, height: 0.25, depth: 1.4, color: c, collide: "false", mat: m }, g);
    box({ z: -2.9, width: 0.3, height: 0.18, depth: 1.1, color: c, collide: "false", mat: m }, g);
    return g;
  }

  function buildNature() {
    const nTrees = LOW ? 35 : 65;
    for (let i = 0; i < nTrees; i++) {
      const a = rand() * Math.PI * 2, r = 232 + rand() * 170;
      const x = Math.cos(a) * r, z = CZ + Math.sin(a) * r;
      if (Math.abs(z - CZ) < 8 && Math.abs(x) > HALF - 5 && Math.abs(x) < 335) continue; // keep piers clear
      if (r > 309 && r < 331) continue;                                                // airboat lane
      if (x > ISLAND.x1 - 4 && x < ISLAND.x2 + 4 && z > ISLAND.z1 - 4 && z < ISLAND.z2 + 4) continue;
      tree(x, z, 0.9 + rand() * 0.6, true);
    }
    const nPads = LOW ? 40 : 80;
    for (let i = 0; i < nPads; i++) {
      const a = rand() * Math.PI * 2, r = HALF + 6 + rand() * 180;
      cyl({ x: Math.cos(a) * r, y: -0.39, z: CZ + Math.sin(a) * r, radius: 0.5 + rand() * 0.7, height: 0.04, color: rand() < 0.15 ? "#e88fb8" : "#4f7a35", collide: "false", mat: "lily" });
    }
    const nReeds = LOW ? 50 : 100;
    const shore = (o1, o2) => {
      const side = Math.floor(rand() * 4), u = (rand() - 0.5) * 2 * HALF, o = HALF + o1 + rand() * o2;
      return [side < 2 ? u : (side === 2 ? o : -o), CZ + (side < 2 ? (side === 0 ? o : -o) : u)];
    };
    for (let i = 0; i < nReeds; i++) {
      const [x, z] = shore(1, 6);
      if (Math.abs(z - CZ) < 6 && Math.abs(x) > HALF - 2) continue; // pier
      if (NAT) natModel(rand() < 0.85 ? "grass-large" : "plant-flowers", x, -0.55, z, 2.6 + rand() * 1.6, rand() * 360, false);
      else cyl({ x, y: 0.3, z, radius: 0.05, height: 1.6 + rand(), color: rand() < 0.5 ? "#7a8a3a" : "#8f9a4a", collide: "false" });
    }
    if (NAT) {
      for (let i = 0; i < (LOW ? 15 : 30); i++) { const [x, z] = shore(0, 4); if (Math.abs(z - CZ) < 6) continue; natModel("rock-" + (1 + Math.floor(rand() * 5)), x, -0.9, z, 1.2 + rand() * 1.6, rand() * 360, false); }
      for (let i = 0; i < (LOW ? 20 : 45); i++) { const [x, z] = shore(4, 26); if (Math.abs(z - CZ) < 8) continue; natModel("deadtree-" + (1 + Math.floor(rand() * 10)), x, -1.1, z, 1.4 + rand() * 0.7, rand() * 360, true); }
    }
    // swimming gators (they move, so they stay live)
    live(() => { for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.3, r = 245 + (i % 2) * 30;
      const x = Math.cos(a) * r, z = CZ + Math.sin(a) * r;
      const g = gatorModel(x, -0.42, z, (a * 180 / Math.PI) % 360, 1.2);
      el("m-attr-anim", { attr: "x", start: r2(x - 6), end: r2(x + 6), duration: 22000 + i * 3000, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
    } });
  }

  function buildOuter() {

    drop(cid, hideTeam) {
      const a = "hide-" + hideTeam;
      if (!needTeam(cid, a)) return;
      if (ACTIVE !== "heist") return say(cid, a, "No job running right now", "bad");
      if (!this.carry.has(cid)) return say(cid, a, "No bag - grab one from the bank vault", "bad");
      if (teamOf(cid) !== hideTeam) return say(cid, a, "Wrong hideout! Yours is " + TEAMS[teamOf(cid)].name, "bad");
      this.carry.delete(cid);
      this.cool.set(cid, now() + 3000);
      this.banked++;
      award(hideTeam, 1);
      say(cid, a, "BANKED! +1 for " + TEAMS[hideTeam].name + " - go again", "good");
    },
    tick(t) {
      for (const [cid, since] of this.carry) if (t - since > 75000) {
        this.carry.delete(cid);
        say(cid, "vault", "DYE PACK! Your bag exploded - grab another", "bad");
      }
      if (t >= this.endAt) finishRound();
    },
    status(t) { return ACTIVE === "heist" ? "BANK JOB  |  " + mmss(this.endAt - t) + " LEFT  |  " + this.banked + " BAGS BANKED  |  " + this.carry.size + " ON THE RUN" : "Idle"; }
  };

  // ---- BAYOU RUN ---------------------------------------------------------------
  const CPS = [ // a loop round the middle ring road (x/z = +-150) and back to the plaza
    [-15, CZ + 50, 90], [-50, CZ + 125, 0], [-100, CZ + 150, 90], [-150, CZ + 100, 0], [-150, CZ, 0],
    [-150, CZ - 100, 0], [-100, CZ - 150, 90], [0, CZ - 150, 90], [100, CZ - 150, 90], [150, CZ - 100, 0],
    [150, CZ, 0], [150, CZ + 100, 0], [100, CZ + 150, 90], [50, CZ + 125, 0], [15, CZ + 50, 90]
  ];
  const race = {
    endAt: 0, next: new Map(), done: [], marks: new Map(), pads: [],
    start() {
      this.endAt = now() + 300000; this.done = []; this.next.clear();
      for (const m of this.marks.values()) m.remove();
      this.marks.clear();
      for (const cid of TEAM.keys()) this.join(cid);
    },
    stop() { for (const m of this.marks.values()) m.remove(); this.marks.clear(); this.next.clear(); },
    join(cid) {
      if (this.next.has(cid) || this.done.includes(cid)) return;
      this.next.set(cid, 0);
      this.marks.set(cid, el("m-cylinder", { x: CPS[0][0], y: 15, z: CPS[0][1], radius: 1.1, height: 30, color: TEAMS[teamOf(cid)].color, opacity: 0.45, collide: "false", "cast-shadows": "false", "visible-to": String(cid) }));
    },
    leave(cid) { this.next.delete(cid); const m = this.marks.get(cid); if (m) m.remove(); this.marks.delete(cid); },
    hit(cid, k) {
      if (ACTIVE !== "race" || !TEAM.has(cid)) return;
      if (!this.next.has(cid)) this.join(cid);
      if (this.next.get(cid) !== k) return;
      const n = k + 1;
      if (n >= CPS.length) {
        this.next.delete(cid);
        const m = this.marks.get(cid); if (m) m.remove(); this.marks.delete(cid);
        this.done.push(cid);
        const place = this.done.length, pts = [10, 8, 6][place - 1] || 3;
        award(teamOf(cid), pts);
        say(cid, "cp-" + k, "FINISHED #" + place + "! +" + pts + " for " + TEAMS[teamOf(cid)].name, "good");
        if (place <= 3) flash(nameOf(cid) + " (" + TEAMS[teamOf(cid)].name + ") FINISHES #" + place);
        return;
      }
      this.next.set(cid, n);
      const m = this.marks.get(cid);
      if (m) { m.setAttribute("x", CPS[n][0]); m.setAttribute("z", CPS[n][1]); }
      say(cid, "cp-" + k, "CHECKPOINT " + n + "/" + CPS.length + " - follow your beam", "good");
    },
    driveCheck(cid, x, z) {
      if (ACTIVE !== "race") return;
      const k = this.next.get(cid);
      if (k == null) return;
      if (Math.hypot(CPS[k][0] - x, CPS[k][1] - z) < 7) this.hit(cid, k);
    },
    tick(t) { if (t >= this.endAt || (this.done.length && !this.next.size)) finishRound(); },
    status(t) { return ACTIVE === "race" ? "BAYOU RUN  |  " + mmss(this.endAt - t) + " LEFT  |  " + this.done.length + " FINISHED  |  " + this.next.size + " RACING" : "Idle"; }
  };
  function buildCheckpoints() {
    CPS.forEach(([x, z, ry], k) => {
      const g = grp({ x, z, ry, "data-game": "race", visible: "false" });
      for (const s of [-1, 1]) cyl({ x: s * 6.5, y: 3, radius: 0.3, height: 6, color: "#1b1b1b", collide: "false" }, g);
      const lbl = k === CPS.length - 1 ? "FINISH" : "CHECKPOINT " + (k + 1);
      text(lbl, { y: 6.2, z: 0.05, width: 13.4, height: 1, "font-size": 70, color: "#120d10", "font-color": k === CPS.length - 1 ? PINK : AMBER, emissive: 0.9 }, g);
      text(lbl, { y: 6.2, z: -0.05, ry: 180, width: 13.4, height: 1, "font-size": 70, color: "#120d10", "font-color": k === CPS.length - 1 ? PINK : AMBER, emissive: 0.9 }, g);
      const pad = box({ y: 0.17, width: 12.6, height: 0.05, depth: 3, color: AMBER, opacity: 0.45, "collision-interval": 200 }, g);
      pad.addEventListener("collisionstart", e => { const cid = e.detail && e.detail.connectionId; if (cid != null) race.hit(cid, k); });
      const rr = ry * Math.PI / 180, ox = r2(Math.sin(rr) * 0.06), oz = r2(Math.cos(rr) * 0.06);
      ANCHORS["cp-" + k] = { x: x + ox, y: 4.6, z: z + oz, ry, w: 7, twin: { x: x - ox, z: z - oz, ry: ry + 180 } };
      race.pads.push(pad);
    });
  }

  // ---- GATOR PIT ----------------------------------------------------------------
  const arena = {
    endAt: 0, on: new Set(), holder: -1,
    start() { this.endAt = now() + 180000; this.holder = -1; },
    stop() { this.holder = -1; ARENA.throne.setAttribute("color", "#6a5a3a"); setT(ARENA.board, "GATOR PIT - waiting for the host"); setT(ARENA.board2, "GATOR PIT - waiting for the host"); },
    leave(cid) { this.on.delete(cid); },
    tick(t) {
      const c = [0, 0, 0, 0];
      for (const cid of this.on) { const tm = teamOf(cid); if (tm != null) c[tm]++; }
      const top = Math.max(...c), leaders = c.filter(v => v === top).length;
      const frenzy = this.endAt - t <= 30000;
      let msg;
      if (top > 0 && leaders === 1) {
        this.holder = c.indexOf(top);
        award(this.holder, frenzy ? 2 : 1);
        ARENA.throne.setAttribute("color", TEAMS[this.holder].color);
        msg = TEAMS[this.holder].name + " HOLD THE PIT" + (frenzy ? "  x2 FRENZY" : "");
      } else {
        this.holder = -1;
        ARENA.throne.setAttribute("color", "#6a5a3a");
        msg = top > 0 ? "CONTESTED! push them off" : "THRONE IS EMPTY - get on it";
      }
      setT(ARENA.board, msg + "  |  " + mmss(this.endAt - t));
      setT(ARENA.board2, msg);
      if (t >= this.endAt) finishRound();
    },
    status(t) { return ACTIVE === "arena" ? "GATOR PIT  |  " + mmss(this.endAt - t) + " LEFT  |  " + (this.holder >= 0 ? TEAMS[this.holder].name + " HOLD" : "CONTESTED") + "  |  " + this.on.size + " ON THE THRONE" : "Idle"; }
  };
  function hookArena() {
    const id = e => e.detail && e.detail.connectionId;
    ARENA.throne.addEventListener("collisionstart", e => { const c = id(e); if (c != null) arena.on.add(c); });
    ARENA.throne.addEventListener("collisionmove", e => { const c = id(e); if (c != null) arena.on.add(c); });
    ARENA.throne.addEventListener("collisionend", e => { const c = id(e); if (c != null) arena.on.delete(c); });
  }

  // ---- LUCKY WHEEL ------------------------------------------------------------------
  const casino = {
    spins: 0, phase: "bet", phaseEnd: 0, bets: new Map(), last: "", timers: [],
    start() { this.spins = 0; this.last = ""; this.openBets(); },
    stop() { this.timers.forEach(clearTimeout); this.timers = []; this.bets.clear(); setT(WHEEL.board, "LUCKY WHEEL - waiting for the host"); },
    leave(cid) { this.bets.delete(cid); },
    openBets() { this.phase = "bet"; this.phaseEnd = now() + 20000; this.bets.clear(); },
    bet(cid, sym) {
      if (!needTeam(cid, "bet")) return;
      if (ACTIVE !== "casino") return say(cid, "bet", "The wheel isn't running - wait for LUCKY WHEEL", "bad");
      if (this.phase !== "bet") return say(cid, "bet", "No more bets - wheel is spinning", "bad");
      this.bets.set(cid, sym);
      say(cid, "bet", "Bet placed on " + sym + " - click another to change", "good");
    },
    spin() {
      this.phase = "spin"; this.phaseEnd = now() + 5200; this.spins++;
      const i = Math.floor(Math.random() * SLOTS.length), sym = SLOTS[i];
      const from = WHEEL.rz, mod = ((from + i * 36) % 360 + 360) % 360, target = from - 1080 - mod;
      const steps = 24;
      for (let s = 1; s <= steps; s++) this.timers.push(setTimeout(() => {
        const p = s / steps, e = 1 - Math.pow(1 - p, 3);
        WHEEL.node.setAttribute("rz", r2(from + (target - from) * e));
      }, s * 200));
      WHEEL.rz = target;
      this.timers.push(setTimeout(() => this.pay(sym), 5000));
    },
    pay(sym) {
      this.phase = "pay"; this.phaseEnd = now() + 5000; this.last = sym;
      let winners = 0;
      for (const [cid, b] of this.bets) {
        if (!TEAM.has(cid)) continue;
        if (b === sym) { winners++; award(teamOf(cid), BET_PAY[sym]); say(cid, "bet", sym + "! +" + BET_PAY[sym] + " for " + TEAMS[teamOf(cid)].name, "good"); }
        else say(cid, "bet", "It landed on " + sym + " - no luck", "bad");
      }
      if (sym === "CROWN") flash("CROWN! " + winners + " players hit the jackpot");
    },
    tick(t) {
      if (this.phase === "bet" && t >= this.phaseEnd) this.spin();
      else if (this.phase === "pay" && t >= this.phaseEnd) { if (this.spins >= 6) return finishRound(); this.openBets(); }
      const left = mmss(this.phaseEnd - t);
      setT(WHEEL.board, this.phase === "bet" ? "BETS OPEN  " + left + "  |  SPIN " + (this.spins + 1) + "/6" : this.phase === "spin" ? "SPINNING..." : "LANDED ON " + this.last);
    },
    status(t) { return ACTIVE === "casino" ? "LUCKY WHEEL  |  SPIN " + Math.min(6, this.spins + (this.phase === "bet" ? 1 : 0)) + "/6  |  " + (this.phase === "bet" ? "BETS OPEN " + mmss(this.phaseEnd - t) + "  |  " + this.bets.size + " BETS" : this.phase === "spin" ? "SPINNING" : "LANDED ON " + this.last) : "Idle"; }
  };

  // ---- TURF WAR ----------------------------------------------------------------------
  const TAG_SPOTS = [
    [-30, CZ - 36, 0], [30, CZ - 36, 0], [-38, CZ + 38, 90], [38, CZ + 38, -90], [-57, CZ + 28, 90], [57, CZ + 28, -90],
    [0, CZ - 64, 0], [-62, CZ - 62, 0], [62, CZ - 62, 0], [-62, CZ + 60, 180], [62, CZ + 60, 180], [0, CZ + 72, 0],
    // outer districts
    [-30, CZ - 142, 180], [30, CZ + 142, 0], [-142, CZ - 30, -90], [142, CZ + 30, 90],
    [-125, CZ - 192, 180], [125, CZ + 192, 0], [-192, CZ + 125, -90], [192, CZ - 125, 90]
  ];
  const TAGS = [];
  const turf = {
    endAt: 0, cd: new Map(), sec: 0,
    start() { this.endAt = now() + 240000; this.cd.clear(); this.sec = 0; TAGS.forEach(paintTag.bind(null, -1)); },
    stop() { TAGS.forEach(paintTag.bind(null, -1)); },
    leave(cid) { this.cd.delete(cid); },
    tag(cid, k) {
      const a = "tag-" + k;
      if (!needTeam(cid, a)) return;
      if (ACTIVE !== "turf") return say(cid, a, "Turf War isn't running", "bad");
      const t = teamOf(cid), spot = TAGS[k];
      if (spot.owner === t) return say(cid, a, "Already yours - defend it or move on", "info");
      if (spot.lock > now()) return say(cid, a, "Paint's wet - locked " + Math.ceil((spot.lock - now()) / 1000) + "s", "bad");
      if ((this.cd.get(cid) || 0) > now()) return say(cid, a, "Shake the can - 3 seconds", "bad");
      paintTag(t, spot);
      spot.lock = now() + 8000;
      this.cd.set(cid, now() + 3000);
      say(cid, a, "TAGGED for " + TEAMS[t].name + "!", "good");
    },
    owned() { const c = [0, 0, 0, 0]; TAGS.forEach(s => { if (s.owner >= 0) c[s.owner]++; }); return c; },
    tick(t) {
      if (++this.sec % 5 === 0) this.owned().forEach((n, i) => award(i, n));
      if (t >= this.endAt) finishRound();
    },
    status(t) { return ACTIVE === "turf" ? "TURF WAR  |  " + mmss(this.endAt - t) + " LEFT  |  WALLS " + teamLine(this.owned()) : "Idle"; }
  };
  function paintTag(team, spot) {
    spot.owner = team;
    spot.face.setAttribute("color", team >= 0 ? TEAMS[team].color : "#3a3a3a");
    spot.label.setAttribute("color", team >= 0 ? TEAMS[team].color : "#3a3a3a");
    spot.label.setAttribute("font-color", team >= 0 ? INK : PAPER);
    setT(spot.label, team >= 0 ? TEAMS[team].name : "UNCLAIMED");
  }
  function buildTags() {
    TAG_SPOTS.forEach(([x, z, ry], k) => {
      const g = grp({ x, z, ry });
      const slab = box({ y: 1.9, width: 6.4, height: 3.6, depth: 0.5, color: "#8a8478" }, g);
      const face = glow({ y: 1.9, z: 0.27, width: 5.8, height: 3, color: "#3a3a3a", emissive: 0.4 }, g);
      const label = text("UNCLAIMED", { y: 2.1, z: 0.29, width: 5.6, height: 0.9, "font-size": 70, color: "#3a3a3a", "font-color": PAPER, emissive: 0.6 }, g);
      const small = text("TURF " + (k + 1) + "  |  click to tag", { y: 0.75, z: 0.29, width: 5.6, height: 0.42, "font-size": 26, color: "#111", "font-color": AMBER }, g);
      onClick([slab, face, label, small], cid => turf.tag(cid, k));
      const rad = ry * Math.PI / 180;
      ANCHORS["tag-" + k] = { x: x + Math.sin(rad) * 0.35, y: 4.1, z: z + Math.cos(rad) * 0.35, ry, w: 6 };
      TAGS.push({ owner: -1, lock: 0, face, label });
      footBox(x, z, 7, 1.5, ry);
    });
  }

  const GAMES = { heist, race, arena, casino, turf };

  /* =========================================================================
     VEHICLES: swamp buggies
     ========================================================================= */
  const CARS = [];
  const CAR_COLORS = ["#d6452f", "#2f7fd6", "#e0b23a", "#6fbf4a", "#a24ad6", "#e07a2f", "#2fbfb0", "#d64a8a", "#f2f2f2", "#3a3a3a", "#8fd34a", "#ff7ab8"];
  function buggy(i, x, z, ry) {
    const color = CAR_COLORS[i % CAR_COLORS.length];
    const g = grp({ id: "car-" + i, x, y: 0, z, ry });
    el("m-attr-lerp", { attr: "x,y,z,ry", duration: 220 }, g);
    const parts = [];
    const truck = KEN && !CONFIG.MODELS.buggy;
    if (CONFIG.MODELS.buggy) parts.push(el("m-model", { src: CONFIG.MODELS.buggy }, g));
    else if (truck) parts.push(el("m-model", { src: asset(TRUCKS[i % TRUCKS.length]), y: 0.6, sx: 2, sy: 2, sz: 2 }, g)); // ride in the bed
    else {
      parts.push(box({ y: 0.95, width: 2.8, height: 0.3, depth: 4.6, color }, g));                 // deck - stand here
      parts.push(box({ y: 1.32, z: 1.75, width: 2.6, height: 0.45, depth: 1.1, color }, g));         // hood (click to drive)
      for (const s of [-1, 1]) box({ x: s * 1.36, y: 1.3, z: -0.4, width: 0.1, height: 0.45, depth: 3.4, color: "#1c1c1c", collide: "false" }, g);
      box({ y: 1.3, z: -2.25, width: 2.7, height: 0.45, depth: 0.1, color: "#1c1c1c", collide: "false" }, g);
      for (const [wx, wz] of [[-1.6, 1.45], [1.6, 1.45], [-1.6, -1.45], [1.6, -1.45]])
        cyl({ x: wx, y: 0.62, z: wz, rz: 90, radius: 0.62, height: 0.55, color: "#141414", collide: "false" }, g);
      for (const s of [-1, 1]) cyl({ x: s * 1.25, y: 2.05, z: -0.75, radius: 0.06, height: 1.9, color: "#cfcfcf", collide: "false" }, g);
      box({ y: 3.0, z: -0.75, width: 2.6, height: 0.08, depth: 0.08, color: "#cfcfcf", collide: "false" }, g);
      box({ y: 1.35, z: -0.9, width: 1.1, height: 0.5, depth: 0.8, color: "#3a2a1a", collide: "false" }, g);
      for (const s of [-1, 1]) glow({ x: s * 0.85, y: 1.32, z: 2.31, width: 0.5, height: 0.26, color: "#fff6c8" }, g);
    }
    // driver dashboard (only the driver sees it)
    const dash = truck ? grp({ y: 2.45, z: -0.45, ry: 180, "visible-to": "-1" }, g) : grp({ y: 1.75, z: 0.55, ry: 180, "visible-to": "-1" }, g);
    box({ y: 0.05, z: -0.06, width: 1.95, height: 0.95, depth: 0.06, color: "#0b1a24", collide: "false" }, dash);
    const ctl = (lbl, cx, cy, colr, act) => {
      const b = box({ x: cx, y: cy, width: 0.58, height: 0.36, depth: 0.08, color: colr, collide: "false" }, dash);
      const t = text(lbl, { x: cx, y: cy, z: 0.05, width: 0.56, height: 0.3, "font-size": 15, color: colr, "font-color": INK, emissive: 0.1 }, dash);
      onClick([b, t], cid => control(car, cid, act));
    };
    ctl("LEFT", -0.65, 0.25, "#9fd8e6", "left"); ctl("GAS", 0, 0.25, "#4fe08f", "gas"); ctl("RIGHT", 0.65, 0.25, "#9fd8e6", "right");
    ctl("REVERSE", -0.65, -0.17, "#ffc857", "rev"); ctl("BRAKE", 0, -0.17, "#ff4d6a", "brake"); ctl("EXIT", 0.65, -0.17, "#f4ead8", "exit");
    const tagY = truck ? 3.9 : 3.45, tagZ = truck ? -1.2 : -0.75, free = truck ? "CLICK THE TRUCK TO DRIVE" : "CLICK THE HOOD TO DRIVE";
    const tagF = text(free, { y: tagY, z: tagZ, width: truck ? 4.4 : 3.4, height: 0.42, "font-size": 24, "font-color": AMBER }, g);
    const tagB = text(free, { y: tagY, z: tagZ, ry: 180, width: truck ? 4.4 : 3.4, height: 0.42, "font-size": 24, "font-color": AMBER }, g);
    ANCHORS["car-" + i] = truck ? { parent: g, x: 0, y: 3.2, z: -0.5, ry: 180, w: 3.2 } : { parent: g, x: 0, y: 2.55, z: 0.62, ry: 180, w: 3.2 };
    const car = { i, g, dash, tagF, tagB, free, x, z, y: 0, ry, v: 0, throttle: 0, driver: null, last: 0, home: { x, z, ry } };
    onClick(parts, cid => claim(car, cid));
    CARS.push(car);
  }
  function setCarTag(car) {
    const s = car.driver == null ? car.free : nameOf(car.driver).toUpperCase() + " IS DRIVING";
    setT(car.tagF, s); setT(car.tagB, s);
  }
  function release(car) {
    car.driver = null; car.throttle = 0; car.v = 0;
    car.dash.setAttribute("visible-to", "-1");
    setCarTag(car);
  }
  function claim(car, cid) {
    if (car.driver === cid) return say(cid, "car-" + car.i, "Use the dashboard: GAS, LEFT, RIGHT", "info");
    if (car.driver != null) return say(cid, "car-" + car.i, "Taken - " + nameOf(car.driver) + " is driving", "bad");
    for (const c of CARS) if (c.driver === cid) release(c);
    car.driver = cid; car.last = now();
    car.dash.setAttribute("visible-to", String(cid));
    setCarTag(car);
    say(cid, "car-" + car.i, "Yours! Jump in the back, then hit GAS", "good");
  }
  function control(car, cid, act) {
    if (car.driver !== cid) return;
    car.last = now();
    if (act === "gas") car.throttle = 1;
    else if (act === "rev") car.throttle = -1;
    else if (act === "brake") car.throttle = 0;
    else if (act === "left") { car.ry += 22.5; setCar(car); }
    else if (act === "right") { car.ry -= 22.5; setCar(car); }
    else if (act === "exit") { release(car); say(cid, "car-" + car.i, "Parked. Click it to drive again", "info"); }
  }
  function setCar(car) {
    for (const k of ["x", "y", "z", "ry"]) { const v = String(r2(car[k])); if (car.g.getAttribute(k) !== v) car.g.setAttribute(k, v); }
  }
  const onIsland = (x, z) => x > ISLAND.x1 + 1 && x < ISLAND.x2 - 1 && z > ISLAND.z1 + 1 && z < ISLAND.z2 - 1;
  function blocked(x, z) {
    if (Math.abs(x) > 380 || Math.abs(z - CZ) > 380) return true;
    for (const f of FOOT) {
      if (f.r != null) { if (Math.hypot(x - f.cx, z - f.cz) < f.r + 1.6) return true; }
      else if (x > f.x1 - 1.8 && x < f.x2 + 1.8 && z > f.z1 - 1.8 && z < f.z2 + 1.8) return true;
    }
    return false;
  }
  function carTick() {
    const t = now();
    for (const car of CARS) {
      if (car.driver != null && car.throttle === 0 && t - car.last > 120000) release(car);
      if (!car.throttle) { car.v = 0; continue; }
      const target = car.throttle > 0 ? 14 : -5;
      car.v += (target - car.v) * 0.3;
      const rad = car.ry * Math.PI / 180, dt = 0.2;
      const nx = car.x + Math.sin(rad) * car.v * dt, nz = car.z + Math.cos(rad) * car.v * dt;
      if (blocked(nx, nz)) {
        car.throttle = 0; car.v = 0;
        if (car.driver != null) say(car.driver, "car-" + car.i, "BONK! Steer away, then GAS", "bad");
        continue;
      }
      car.x = nx; car.z = nz; car.y = onIsland(nx, nz) ? 0 : -0.5;
      setCar(car);
      if (car.driver != null) race.driveCheck(car.driver, car.x, car.z);
    }
  }
  function resetCars() { for (const car of CARS) { release(car); car.x = car.home.x; car.z = car.home.z; car.ry = car.home.ry; car.y = 0; setCar(car); } }
  // plaza and ring-road trucks cycle colours; hideout trucks match their team where Kenney has the colour
  const TRUCKS = ["truck-red", "truck-yellow", "truck-green", "truck-purple", "truck-green", "truck-red", "truck-yellow", "truck-purple", "truck-red", "truck-yellow", "truck-green", "truck-purple"];
  function buildCars() {
    [-15, -5, 5, 15].forEach((x, k) => buggy(k, x, CZ + 38, 0)); // plaza, nose toward the south road
    HIDEOUTS.forEach((h, i) => { // one beside each hideout, nose toward the inner road
      const rad = h.ry * Math.PI / 180, lx = -10, lz = 9;
      buggy(4 + i, h.x + lx * Math.cos(rad) + lz * Math.sin(rad), h.z - lx * Math.sin(rad) + lz * Math.cos(rad), h.ry);
    });
    // four more parked on the middle ring road
    [[20, CZ - 150, 90], [-20, CZ + 150, -90], [-150, CZ + 40, 180], [150, CZ - 40, 0]].forEach(([x, z, ry], k) => buggy(8 + k, x, z, ry));
  }

  /* =========================================================================
     ROUND FLOW, BIG SCREEN, HOST BANK
     ========================================================================= */
  function flash(msg) { NOTE = String(msg).slice(0, 70); NOTE_UNTIL = now() + 8000; paintScreen(); }
  function setActive(id) {
    if (ACTIVE) { show(ACTIVE, false); GAMES[ACTIVE].stop(); }
    ACTIVE = id;
    ROUND = [0, 0, 0, 0];
    if (id) { show(id, true); GAMES[id].start(); }
    paintScores(); paintScreen(); pushState();
  }
  function finishRound() {
    const id = ACTIVE;
    if (!id) return;
    const top = Math.max(...ROUND), winners = ROUND.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    const result = top <= 0 ? "NO POINTS SCORED" : winners.length > 1 ? "TIE: " + winners.map(i => TEAMS[i].name).join(" + ") : TEAMS[winners[0]].name + " WIN " + INFO[id].title + "!";
    const line = teamLine(ROUND);
    setActive(null);
    NOTE = result + "  |  " + line; NOTE_UNTIL = now() + 30000;
    paintScreen(); pushState();
  }
  function paintScreen() {
    const t = now(), note = NOTE_UNTIL > t ? NOTE : "";
    if (!ACTIVE) {
      setT(SCREEN.title, "INTERMISSION");
      setT(SCREEN.kind, note || "THE HOST WILL START THE NEXT GAME SOON");
      setT(SCREEN.what, KEN ? "Check in at a team stand below. Grab a truck - click it to drive." : "Check in at a team stand below. Grab a buggy - click its hood to drive.");
      setT(SCREEN.where, "TONIGHT: BANK JOB  |  BAYOU RUN  |  GATOR PIT  |  LUCKY WHEEL  |  TURF WAR");
      setT(SCREEN.status, TEAM.size + " PLAYERS CHECKED IN");
      return;
    }
    const i = INFO[ACTIVE];
    setT(SCREEN.title, i.title);
    setT(SCREEN.kind, note ? "HOST: " + note : i.kind);
    setT(SCREEN.what, i.what);
    setT(SCREEN.where, i.where);
    setT(SCREEN.status, GAMES[ACTIVE].status(t));
  }
  function pushState() {
    const t = now(), s = { boot: BOOT, active: ACTIVE, players: TEAM.size, crews: COUNTS.slice(), series: SERIES.slice(), round: ROUND.slice(), note: NOTE_UNTIL > t ? NOTE : "", cars: CARS.filter(c => c.driver != null).length, games: {} };
    for (const k in GAMES) s.games[k] = GAMES[k].status(t);
    document.getElementById("hb-state").setAttribute("data-state", JSON.stringify(s));
  }

  const FAILS = new Map();
  function hostCommand(cmd, e) {
    const d = (e && e.detail) || {}, p = d.params || {};
    const cid = d.connectionId, key = d.key != null ? d.key : p.key;
    const f = FAILS.get(cid) || { n: 0, until: 0 };
    if (f.until > now()) return;
    if (String(key) !== CONFIG.HOST_KEY) {
      f.n++; if (f.n >= 5) { f.until = now() + 60000; f.n = 0; }
      FAILS.set(cid, f);
      return;
    }
    FAILS.delete(cid);
    if (cmd === "stop") setActive(null);
    else if (cmd === "note") { NOTE = String(d.text != null ? d.text : p.text || "").replace(/[^ -~]/g, "").slice(0, 70); NOTE_UNTIL = NOTE ? now() + 45000 : 0; paintScreen(); }
    else if (cmd === "reset") { SERIES.fill(0); paintScores(); }
    else if (cmd === "cars") resetCars();
    else if (GAMES[cmd]) setActive(cmd); // starting the live game again restarts the round
    pushState();
  }
  function hookHost() {
    for (const cmd of ["heist", "race", "arena", "casino", "turf", "stop", "note", "reset", "cars"])
      document.getElementById("hb-" + cmd).addEventListener("click", e => hostCommand(cmd, e));
  }

  window.addEventListener("disconnected", e => {
    const cid = e.detail && e.detail.connectionId;
    if (cid == null) return;
    for (const g of Object.values(GAMES)) g.leave(cid);
    for (const car of CARS) if (car.driver === cid) release(car);
    for (const [k, v] of SAYS) if (k.startsWith(cid + "|")) { v.nodes.forEach(n => n.remove()); SAYS.delete(k); }
    const y = YOU.get(cid); if (y) { y.remove(); YOU.delete(cid); }
    FAILS.delete(cid);
    if (TEAM.has(cid)) { COUNTS[TEAM.get(cid)]--; TEAM.delete(cid); NAME.delete(cid); paintRoster(); }
    pushState();
  });

  /* =========================================================================
     BUILD + START
     ========================================================================= */
  if (BAKED) for (const n of BAKE_NAMES) natModel(n, 0, 0, 0, 1, 0, true); // the detailed textured city
  stat(buildGround);
  stat(buildRoads);
  stat(buildPlaza);
  stat(buildCasino);
  stat(buildArena);
  stat(buildDowntown);
  stat(buildNeonRow);
  stat(buildHideouts);
  stat(buildLandmarks);
  stat(buildNature);
  stat(buildAirboats);
  buildClouds();
  buildCheckpoints();
  buildTags();
  buildCars();
  stat(buildOuter);
  buildOptional();
  hookPrompts();
  hookArena();
  hookHost();
  onClick(document.getElementById("vault"), cid => heist.grab(cid));

  setInterval(carTick, 200);
  setInterval(() => {
    const t = now();
    if (ACTIVE) GAMES[ACTIVE].tick(t);
    for (const [k, v] of SAYS) if (t >= v.until) { v.nodes.forEach(n => n.remove()); SAYS.delete(k); }
    paintScreen();
    pushState();
  }, 1000);
  paintRoster();
  paintScores();
  setActive(null);
})();
</script>
